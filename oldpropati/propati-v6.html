            <div class="em-kpi-change up">of ${org.max_units||20} on ${org.plan_tier||'starter'} plan</div>
          </div>
          <div class="em-kpi" style="border-top:3px solid #2AAD72">
            <div class="em-kpi-val">${props.length ? Math.round((occupied/props.length)*100) : 0}%</div>
            <div class="em-kpi-label">Occupancy Rate</div>
            <div class="em-kpi-change">${occupied} occupied · ${vacant} vacant</div>
          </div>
          <div class="em-kpi" style="border-top:3px solid #EF4444">
            <div class="em-kpi-val">${arrears}</div>
            <div class="em-kpi-label">Rent Arrears</div>
            <div class="em-kpi-change down">${arrears > 0 ? 'Overdue payments' : 'All up to date ✓'}</div>
          </div>
          <div class="em-kpi" style="border-top:3px solid #C9952A">
            <div class="em-kpi-val">${openT}</div>
            <div class="em-kpi-label">Open Tickets</div>
            <div class="em-kpi-change ${openT > 0 ? 'down' : 'up'}">${openT > 0 ? 'Needs attention' : 'All resolved ✓'}</div>
          </div>
        </div>

        <div class="em-two-col">
          <div class="em-card">
            <div class="em-card-title">
              Recent Properties
              <button class="em-btn em-btn-primary" data-action="em-navigate" data-page="portfolio">View All →</button>
            </div>
            ${props.length === 0 ? `<div class="em-empty"><div class="em-empty-icon">🏘️</div><div>No properties yet</div><button class="em-btn em-btn-primary" style="margin-top:0.8rem" data-action="em-navigate" data-page="bulk-upload">Import Properties</button></div>` :
              props.slice(0,4).map(p => `
              <div style="display:flex;align-items:center;gap:0.8rem;padding:0.6rem 0;border-bottom:1px solid #1A2A3A">
                <div style="font-size:1.5rem">🏠</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:0.83rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.title||'Property'}</div>
                  <div style="font-size:0.72rem;color:#5A7A9A">${p.location||p.address||'—'}</div>
                </div>
                <span class="em-tag ${p.is_occupied||p.tenant_id ? 'em-tag-occupied' : 'em-tag-vacant'}">${p.is_occupied||p.tenant_id ? 'Occupied' : 'Vacant'}</span>
              </div>`).join('')}
            </div>
          </div>

          <div class="em-card">
            <div class="em-card-title">
              Open Maintenance Tickets
              <button class="em-btn em-btn-primary" data-action="em-navigate" data-page="maintenance">View All →</button>
            </div>
            ${tickets.filter(t=>t.status==='open').length === 0 ?
              `<div class="em-empty"><div class="em-empty-icon">✅</div><div>No open tickets</div></div>` :
              tickets.filter(t=>t.status==='open').slice(0,4).map(t => `
              <div class="em-ticket" style="margin-bottom:0.5rem;padding:0.7rem">
                <div style="display:flex;justify-content:space-between;align-items:flex-start">
                  <div class="em-ticket-title" style="font-size:0.82rem">${t.title}</div>
                  <span class="em-prio em-prio-${t.priority||'medium'}">${t.priority||'medium'}</span>
                </div>
                <div class="em-ticket-meta">${t.category||''} · ${new Date(t.created_at).toLocaleDateString('en-NG')}</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="em-card" style="margin-top:0">
          <div class="em-card-title">Quick Actions</div>
          <div style="display:flex;gap:0.8rem;flex-wrap:wrap">
            <button class="em-btn em-btn-primary" data-action="em-navigate" data-page="bulk-upload">📤 Import Properties</button>
            <button class="em-btn em-btn-primary" data-action="em-navigate" data-page="maintenance">🔧 View Tickets</button>
            <button class="em-btn em-btn-gold" data-action="em-navigate" data-page="reports">📄 Generate Report</button>
            <button class="em-btn em-btn-primary" data-action="em-navigate" data-page="team">👥 Manage Team</button>
          </div>
        </div>`;
    }

    // ─── PORTFOLIO: ALL PROPERTIES ─────────────────────────────
    case 'portfolio': {
      const props = DATA.emPortfolio;
      if (!props) return `<div class="em-empty"><div class="em-empty-icon">⏳</div>Loading properties…</div>`;
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
          <div style="font-size:0.82rem;color:#5A7A9A">${props.length} of ${org.max_units||20} units on ${org.plan_tier||'starter'} plan</div>
          <button class="em-btn em-btn-primary" data-action="em-navigate" data-page="bulk-upload">📤 Bulk Import</button>
        </div>
        ${props.length === 0 ? `<div class="em-empty"><div class="em-empty-icon">🏘️</div><div style="font-size:1rem;font-weight:700;color:#fff;margin-bottom:0.5rem">No properties yet</div><div style="margin-bottom:1rem">Import your portfolio from a CSV file or add properties individually as a Landlord</div><button class="em-btn em-btn-gold" data-action="em-navigate" data-page="bulk-upload">📤 Import from CSV</button></div>` :
        `<div class="em-prop-grid">
          ${props.map(p => `
          <div class="em-prop-card">
            <div class="em-prop-thumb" style="${p.images&&p.images[0]?`background:url('${p.images[0]}') center/cover`:''}">
              ${!p.images||!p.images[0] ? '🏠' : ''}
            </div>
            <div class="em-prop-name">${p.title||'Property'}</div>
            <div class="em-prop-addr">${p.location||p.address||'—'}</div>
            <div style="font-size:0.78rem;color:#C9952A;font-weight:700;margin-top:0.4rem">${fmtNaira(p.price)}/yr</div>
            <div class="em-prop-badges">
              <span class="em-tag ${p.is_occupied||p.tenant_id ? 'em-tag-occupied' : 'em-tag-vacant'}">${p.is_occupied||p.tenant_id ? 'Occupied' : 'Vacant'}</span>
              ${p.trust_level === 'certified' ? '<span class="em-tag em-tag-verified">⭐ Certified</span>' : ''}
              <span class="em-tag" style="background:#1A2A3A;color:#5A7A9A">${p.bedrooms||'?'} bed · ${p.bathrooms||'?'} bath</span>
            </div>
          </div>`).join('')}
        </div>`}`;
    }

    // ─── RENT LEDGER ──────────────────────────────────────────
    case 'rent': {
      const ledger = DATA.emLedger;
      if (!ledger) { loadEmLedger(); return `<div class="em-empty"><div class="em-empty-icon">⏳</div>Loading rent ledger…</div>`; }
      const totalDue = ledger.reduce((s,e) => s + (parseFloat(e.amount_due)||0), 0);
      const totalPaid = ledger.reduce((s,e) => s + (parseFloat(e.amount_paid)||0), 0);
      const overdue = ledger.filter(e => e.status === 'overdue');
      return `
        <div class="em-kpi-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="em-kpi" style="border-top:3px solid #2AAD72">
            <div class="em-kpi-val" style="font-size:1.2rem">${fmtNaira(totalPaid)}</div>
            <div class="em-kpi-label">Collected This Month</div>
          </div>
          <div class="em-kpi" style="border-top:3px solid #EF4444">
            <div class="em-kpi-val" style="font-size:1.2rem">${fmtNaira(totalDue - totalPaid)}</div>
            <div class="em-kpi-label">Outstanding</div>
            <div class="em-kpi-change down">${overdue.length} overdue units</div>
          </div>
          <div class="em-kpi" style="border-top:3px solid #C9952A">
            <div class="em-kpi-val" style="font-size:1.2rem">${fmtNaira(totalDue)}</div>
            <div class="em-kpi-label">Total Expected</div>
          </div>
        </div>
        <div class="em-card">
          <div class="em-card-title">Rent Ledger — All Units</div>
          <div class="em-ledger-row header">
            <span>Property</span><span>Tenant</span><span>Due Date</span><span>Amount</span><span>Paid</span><span>Status</span>
          </div>
          ${ledger.length === 0 ? `<div class="em-empty" style="padding:1.5rem"><div>No rent records yet</div></div>` :
            ledger.map(e => `
            <div class="em-ledger-row">
              <span style="color:#fff;font-weight:600;font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.property_title||'Property'}</span>
              <span>${e.tenant_name||'—'}</span>
              <span>${e.due_date ? new Date(e.due_date).toLocaleDateString('en-NG') : '—'}</span>
              <span style="color:#C9952A;font-weight:700">${fmtNaira(e.amount_due)}</span>
              <span style="color:#2AAD72">${fmtNaira(e.amount_paid)}</span>
              <span class="em-status em-status-${e.status||'open'}">${e.status||'pending'}</span>
            </div>`).join('')}
        </div>`;
    }

    // ─── MAINTENANCE QUEUE ────────────────────────────────────
    case 'maintenance': {
      const tickets = DATA.emTickets || [];
      const filter = STATE.emTicketFilter || 'all';
      const shown = filter === 'all' ? tickets : tickets.filter(t => t.status === filter);
      const props = DATA.emPortfolio || [];
      return `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;flex-wrap:wrap;gap:0.8rem">
          <div class="em-filter-tabs">
            ${['all','open','assigned','in_progress','resolved'].map(f => `
            <div class="em-filter-tab ${filter===f?'active':''}" data-action="em-ticket-filter" data-filter="${f}">${f==='in_progress'?'In Progress':f.charAt(0).toUpperCase()+f.slice(1)} ${f!=='all'?`(${tickets.filter(t=>f==='all'||t.status===f).length})`:'('+tickets.length+')'}</div>`).join('')}
          </div>
        </div>

        <div class="em-two-col">
          <div>
            ${shown.length === 0 ? `<div class="em-empty"><div class="em-empty-icon">✅</div><div>No ${filter === 'all' ? '' : filter} tickets</div></div>` :
              shown.map(t => `
              <div class="em-ticket">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
                  <div class="em-ticket-title">${t.title}</div>
                  <div style="display:flex;gap:0.4rem;flex-shrink:0">
                    <span class="em-prio em-prio-${t.priority||'medium'}">${t.priority||'medium'}</span>
                    <span class="em-status em-status-${t.status||'open'}">${(t.status||'open').replace('_',' ')}</span>
                  </div>
                </div>
                ${t.description ? `<div style="font-size:0.78rem;color:#5A7A9A;margin-top:0.4rem">${t.description}</div>` : ''}
                <div class="em-ticket-meta">
                  <span>📍 ${t.property_title||'Unknown property'}</span>
                  <span>🏷️ ${t.category||'other'}</span>
                  <span>📅 ${new Date(t.created_at).toLocaleDateString('en-NG')}</span>
                  ${t.assigned_name ? `<span>👤 ${t.assigned_name}</span>` : ''}
                </div>
                <div style="display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap">
                  ${t.status === 'open' ? `<button class="em-btn em-btn-primary" style="padding:0.3rem 0.7rem;font-size:0.75rem" onclick="emUpdateTicket('${t.id}',{status:'assigned'})">Assign</button>` : ''}
                  ${t.status === 'assigned' ? `<button class="em-btn em-btn-primary" style="padding:0.3rem 0.7rem;font-size:0.75rem" onclick="emUpdateTicket('${t.id}',{status:'in_progress'})">Start Work</button>` : ''}
                  ${['assigned','in_progress'].includes(t.status) ? `<button class="em-btn" style="padding:0.3rem 0.7rem;font-size:0.75rem;background:rgba(42,173,114,0.15);color:#2AAD72;border:1px solid rgba(42,173,114,0.3)" onclick="emUpdateTicket('${t.id}',{status:'resolved'})">Mark Resolved</button>` : ''}
                  ${t.status === 'resolved' ? `<button class="em-btn" style="padding:0.3rem 0.7rem;font-size:0.75rem;background:#1A2A3A;color:#5A7A9A" onclick="emUpdateTicket('${t.id}',{status:'closed'})">Close</button>` : ''}
                </div>
              </div>`).join('')}
          </div>

          <div class="em-card" style="height:fit-content">
            <div class="em-card-title">Log New Ticket</div>
            <div style="display:flex;flex-direction:column;gap:0.7rem">
              <div>
                <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Property</div>
                <select class="em-select" id="em-ticket-prop">
                  <option value="">Select property…</option>
                  ${props.map(p => `<option value="${p.id}">${p.title||p.location||'Property'}</option>`).join('')}
                </select>
              </div>
              <div>
                <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Title *</div>
                <input class="em-inp" id="em-ticket-title" placeholder="e.g. Burst pipe in bathroom 2"/>
              </div>
              <div>
                <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Description</div>
                <textarea class="em-inp" id="em-ticket-desc" rows="3" placeholder="Describe the issue in detail…" style="resize:vertical"></textarea>
              </div>
              <div class="em-two-col" style="gap:0.6rem">
                <div>
                  <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Category</div>
                  <select class="em-select" id="em-ticket-cat">
                    <option value="plumbing">Plumbing</option>
                    <option value="electrical">Electrical</option>
                    <option value="structural">Structural</option>
                    <option value="security">Security</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div>
                  <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Priority</div>
                  <select class="em-select" id="em-ticket-prio">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                  </select>
                </div>
              </div>
              <button class="em-btn em-btn-gold" onclick="emCreateTicket()" style="width:100%">Submit Ticket</button>
            </div>
          </div>
        </div>`;
    }

    // ─── BULK UPLOAD ──────────────────────────────────────────
    case 'bulk-upload': {
      const preview = DATA.emBulkPreview || [];
      return `
        <div class="em-two-col">
          <div>
            <div class="em-card">
              <div class="em-card-title">Import Properties from CSV</div>
              <div class="em-upload-zone" onclick="document.getElementById('em-bulk-file').click()">
                <div style="font-size:2.5rem;margin-bottom:0.8rem">📤</div>
                <div style="font-size:0.9rem;font-weight:700;color:#fff;margin-bottom:0.4rem">Drop CSV / Excel here or click to browse</div>
                <div style="font-size:0.78rem;color:#5A7A9A">Supports .csv and .xlsx — max 500 rows per upload</div>
              </div>
              <input type="file" id="em-bulk-file" accept=".csv,.xlsx" style="display:none" onchange="STATE.emBulkFile=this.files[0];render()"/>
              ${STATE.emBulkFile ? `<div style="margin-top:0.8rem;padding:0.6rem 0.8rem;background:#131D2E;border-radius:8px;font-size:0.8rem;color:#6EA8FE">📎 ${typeof STATE.emBulkFile === 'object' && STATE.emBulkFile.name ? STATE.emBulkFile.name : 'File selected'}</div>` : ''}
              <button class="em-btn em-btn-gold" style="width:100%;margin-top:0.8rem" onclick="emBulkUpload()" ${STATE.authLoading?'disabled':''}>
                ${STATE.authLoading ? '⏳ Uploading…' : '📤 Upload & Import'}
              </button>
            </div>

            <div class="em-card">
              <div class="em-card-title">Required CSV Columns</div>
              <div style="font-size:0.8rem;color:#5A7A9A;line-height:1.8">
                ${[['title *','Property name e.g. "3-Bed Flat, Lekki Phase 1"'],
                   ['listing_type *','rent | buy | shortlet | share | commercial'],
                   ['property_type *','flat | duplex | bungalow | land | office | shop'],
                   ['address *','Full street address'],
                   ['location *','Area / LGA e.g. "Lekki, Lagos"'],
                   ['price *','Annual rent in Naira (numbers only)'],
                   ['bedrooms','Number of bedrooms'],
                   ['bathrooms','Number of bathrooms'],
                   ['size_sqm','Size in square metres'],
                   ['description','Property description'],
                ].map(([col, desc]) => `
                <div style="display:grid;grid-template-columns:140px 1fr;gap:0.5rem;padding:0.3rem 0;border-bottom:1px solid #1A2A3A">
                  <code style="color:#6EA8FE;font-size:0.78rem">${col}</code>
                  <span style="font-size:0.75rem">${desc}</span>
                </div>`).join('')}
              </div>
              <a href="${API}/orgs/bulk-template.csv" download style="display:inline-block;margin-top:0.8rem;font-size:0.8rem;color:#C9952A;text-decoration:none">⬇ Download template CSV</a>
            </div>
          </div>

          <div>
            ${preview.length > 0 ? `
            <div class="em-card">
              <div class="em-card-title">Import Preview (${preview.length} rows)</div>
              ${preview.slice(0,8).map((row, i) => `
              <div style="padding:0.6rem 0;border-bottom:1px solid #1A2A3A">
                <div style="font-size:0.82rem;font-weight:700;color:${row.error?'#EF4444':'#fff'}">${i+1}. ${row.title||'—'}</div>
                <div style="font-size:0.72rem;color:#5A7A9A">${row.location||''} · ${fmtNaira(row.price)}</div>
                ${row.error ? `<div style="font-size:0.7rem;color:#EF4444;margin-top:0.2rem">⚠ ${row.error}</div>` : ''}
              </div>`).join('')}
              ${preview.length > 8 ? `<div style="font-size:0.75rem;color:#5A7A9A;margin-top:0.5rem">…and ${preview.length-8} more rows</div>` : ''}
            </div>` : `
            <div class="em-card" style="height:fit-content">
              <div style="text-align:center;padding:2rem;color:#3A5A7A">
                <div style="font-size:2rem;margin-bottom:0.8rem">📋</div>
                <div style="font-weight:700;color:#5A7A9A">Import preview will appear here</div>
                <div style="font-size:0.78rem;margin-top:0.4rem">Upload a CSV to see a preview before confirming</div>
              </div>
            </div>`}
          </div>
        </div>`;
    }

    // ─── AGREEMENTS ───────────────────────────────────────────
    case 'agreements': {
      const props = (DATA.emPortfolio||[]).filter(p => p.tenant_id || p.is_occupied);
      return `
        <div class="em-card">
          <div class="em-card-title">
            Active Lease Agreements
            <span style="font-size:0.75rem;color:#5A7A9A">${props.length} occupied units</span>
          </div>
          ${props.length === 0 ? `<div class="em-empty"><div class="em-empty-icon">📋</div><div>No active agreements — properties must have tenants</div></div>` :
            props.map(p => `
            <div style="display:flex;align-items:center;gap:1rem;padding:0.8rem 0;border-bottom:1px solid #1A2A3A">
              <div style="font-size:1.4rem">🏠</div>
              <div style="flex:1">
                <div style="font-size:0.85rem;font-weight:700;color:#fff">${p.title||'Property'}</div>
                <div style="font-size:0.72rem;color:#5A7A9A">${p.tenant_name||'Tenant'} · ${p.location||''}</div>
                <div style="font-size:0.72rem;color:#C9952A;margin-top:0.2rem">${fmtNaira(p.price)}/yr</div>
              </div>
              <div style="display:flex;gap:0.5rem">
                <button class="em-btn em-btn-primary" style="padding:0.35rem 0.8rem;font-size:0.75rem">View Agreement</button>
                <button class="em-btn" style="padding:0.35rem 0.8rem;font-size:0.75rem;background:#1A2A3A;color:#5A7A9A">Renew</button>
              </div>
            </div>`).join('')}
        </div>`;
    }

    // ─── TEAM & SEATS ─────────────────────────────────────────
    case 'team': {
      const team = DATA.emTeam;
      if (!team) return `<div class="em-empty"><div class="em-empty-icon">⏳</div>Loading team…</div>`;
      const planSeats = { starter:1, growth:5, enterprise:999 };
      const maxSeats = planSeats[org.plan_tier||'starter'] || 1;
      const roleColors = { manager:'#6EA8FE', accountant:'#2AAD72', maintenance:'#F59E0B', owner_view:'#A855F7' };
      const inv = STATE.emInviteForm;
      return `
        <div class="em-two-col">
          <div>
            <div class="em-card">
              <div class="em-card-title">
                Team Members
                <span style="font-size:0.75rem;color:#5A7A9A">${team.length} / ${maxSeats === 999 ? '∞' : maxSeats} seats used</span>
              </div>
              ${team.length === 0 ? `<div class="em-empty" style="padding:1.5rem"><div>No team members yet — invite your first staff member</div></div>` :
                team.map(m => `
                <div class="em-team-row">
                  <div class="em-team-av">${(m.full_name||m.email||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-size:0.85rem;font-weight:700;color:#fff">${m.full_name||m.email}</div>
                    <div style="font-size:0.72rem;color:#5A7A9A">${m.email}</div>
                    <div style="font-size:0.68rem;margin-top:0.2rem">
                      <span style="color:${roleColors[m.role]||'#5A7A9A'};font-weight:700;text-transform:capitalize">${(m.role||'').replace('_',' ')}</span>
                      ${m.status === 'pending' ? '<span style="color:#F59E0B;margin-left:0.5rem">· Invite pending</span>' : ''}
                    </div>
                  </div>
                  ${m.role !== 'manager' ? `<button class="em-btn em-btn-danger" style="padding:0.3rem 0.6rem;font-size:0.72rem" onclick="emRemoveMember('${m.user_id||m.id}')">Remove</button>` : ''}
                </div>`).join('')}
            </div>

            <div class="em-card" style="margin-top:0">
              <div class="em-card-title" style="margin-bottom:0.5rem">Role Permissions</div>
              ${[
                ['manager','Full access — manage properties, tenants, payments, reports','#6EA8FE'],
                ['accountant','Rent ledger, payment approvals, report download only','#2AAD72'],
                ['maintenance','Maintenance ticket queue — assign, update, resolve only','#F59E0B'],
                ['owner_view','Read-only — sees monthly reports sent to property owner','#A855F7'],
              ].map(([role, desc, col]) => `
              <div style="padding:0.5rem 0;border-bottom:1px solid #1A2A3A;display:flex;gap:0.7rem;align-items:flex-start">
                <span style="color:${col};font-size:0.78rem;font-weight:700;min-width:90px;text-transform:capitalize">${role.replace('_',' ')}</span>
                <span style="font-size:0.75rem;color:#5A7A9A">${desc}</span>
              </div>`).join('')}
            </div>
          </div>

          <div class="em-card" style="height:fit-content">
            <div class="em-card-title">Invite Team Member</div>
            ${team.length >= maxSeats && maxSeats !== 999 ? `
            <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:0.8rem;font-size:0.82rem;color:#EF4444;margin-bottom:1rem">
              ⚠ Seat limit reached (${maxSeats} on ${org.plan_tier} plan).

              <div>
                <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Role</div>

    // ─── PLAN & BILLING ───────────────────────────────────────

      const plans = [
        { id:'starter', name:'Starter', price:'₦25,000', units:20, seats:1, features:['1 manager seat','Portfolio dashboard','Automated rent reminders','Basic maintenance ticketing','Email support'] },

        { id:'enterprise', name:'Enterprise', price:'₦150,000', units:9999, seats:9999, features:['Unlimited staff seats','Everything in Growth','White-label tenant portal','API access for integrations','NIN verification (NIMC)','Dedicated account manager'] },

      const current = org.plan_tier || 'starter';
      return `
        ${sub ? `

        <div style="font-size:0.78rem;font-weight:700;color:#5A7A9A;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.8rem">
          ${current === 'starter' ? 'Choose a plan to unlock more units' : 'Upgrade or change your plan'}
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.2rem">
          ${plans.map(p => `
          <div class="em-plan-card ${current===p.id?'selected':''}" style="${current===p.id?'border-color:#6EA8FE;background:#131D2E':''}">
            ${p.popular ? `<div style="font-size:0.7rem;font-weight:700;color:#C9952A;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:0.4rem">⭐ Most Popular</div>` : ''}
            <div style="font-size:0.9rem;font-weight:700;color:${current===p.id?'#6EA8FE':'#fff'};margin-bottom:0.2rem">${p.name}</div>

            <div style="font-size:0.72rem;color:#5A7A9A;margin-bottom:0.8rem">/month · up to ${p.units===9999?'unlimited':p.units} units · ${p.seats===9999?'unlimited':p.seats} seat${p.seats!==1?'s':''}</div>
            ${p.features.map(f => `<div style="font-size:0.75rem;color:#7A9ABF;margin-bottom:0.3rem">✓ ${f}</div>`).join('')}
            ${current !== p.id ? `
            <button class="em-btn ${p.popular?'em-btn-gold':'em-btn-primary'}" style="width:100%;margin-top:0.8rem" onclick="emSubscribePlan('${p.id}')" ${STATE.authLoading?'disabled':''}>
              ${STATE.authLoading ? '⏳' : current === 'starter' || plans.findIndex(x=>x.id===current) < plans.findIndex(x=>x.id===p.id) ? 'Upgrade to '+p.name : 'Downgrade to '+p.name}
            </button>` : `<div style="margin-top:0.8rem;font-size:0.8rem;color:#6EA8FE;font-weight:700;text-align:center">✓ Current Plan</div>`}
          </div>`).join('')}
        </div>

        <div class="em-card">
          <div class="em-card-title">Organisation Details</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem">
            ${[['Organisation Name', org.name||'—'], ['Billing Email', org.billing_email||'—'], ['CAC Number', org.cac_number||'Not provided'], ['Address', org.address||'Not provided']].map(([label, val]) => `
            <div>
              <div style="font-size:0.72rem;color:#5A7A9A;margin-bottom:0.2rem">${label}</div>
              <div style="font-size:0.85rem;color:#fff">${val}</div>
            </div>`).join('')}
          </div>
        </div>

        <div class="em-card" style="background:rgba(239,68,68,0.05);border-color:rgba(239,68,68,0.2)">
          <div class="em-card-title" style="color:#EF4444">Danger Zone</div>
          <div style="font-size:0.82rem;color:#7A9ABF;margin-bottom:0.8rem">Cancelling your subscription will remove access to B2B features at the end of the billing period. Your individual landlord account and listings will remain.</div>
          <button class="em-btn em-btn-danger">Cancel Subscription</button>
        </div>`;
    }

    // ─── REPORTS ──────────────────────────────────────────────
    case 'reports': {
      const months = [];
      const now = new Date();
      for (let i = 0; i < 12; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        months.push({ value: d.toISOString().slice(0,7), label: d.toLocaleDateString('en-NG', {month:'long', year:'numeric'}) });
      }
      return `
        <div class="em-two-col">

              <div style="font-size:0.75rem;color:#5A7A9A;margin-bottom:0.3rem">Report Month</div>
              <select class="em-select" onchange="STATE.emReportMonth=this.value;render()">

              </select>
            </div>
            <button class="em-btn em-btn-gold" style="width:100%" onclick="emDownloadReport()" ${STATE.authLoading?'disabled':''}>
              ${STATE.authLoading ? '⏳ Generating…' : '📄 Generate & Download PDF'}
            </button>
            <div style="font-size:0.72rem;color:#3A5A7A;margin-top:0.6rem">PDF includes: total units, occupancy, rent collected, arrears breakdown, open maintenance tickets, and next month rent schedule.</div>
          </div>

          <div class="em-card">
            <div class="em-card-title">Report Contents</div>
            ${[
              ['Executive Summary','Total units, occupancy %, monthly rent collected'],
              ['Rent Collection','Per-unit breakdown of paid, due, and overdue'],
              ['Arrears Report','Tenants with outstanding balances and days overdue'],
              ['Maintenance Log','All tickets opened/closed in the month'],
              ['Upcoming Schedule','Rent due dates and lease expiries next month'],
              ['Portfolio Valuation','Estimated annual yield across all managed units'],
            ].map(([title, desc]) => `
            <div style="padding:0.6rem 0;border-bottom:1px solid #1A2A3A;display:flex;gap:0.8rem;align-items:flex-start">
              <span style="color:#C9952A;font-size:0.8rem">✓</span>
              <div>
                <div style="font-size:0.82rem;font-weight:700;color:#fff">${title}</div>
                <div style="font-size:0.72rem;color:#5A7A9A">${desc}</div>
              </div>
            </div>`).join('')}
          </div>
        </div>`;
    }

    default: return `<div class="em-empty"><div class="em-empty-icon">🏢</div><div>${page} — coming soon</div></div>`;
  }
}

function toggleAI() {
  AI_STATE.open = !AI_STATE.open;
  renderAI();
}

async function sendAI(preset) {
  const inp = document.getElementById('ai-input');
  const text = preset || (inp ? inp.value.trim() : '') || AI_STATE.inputVal.trim();
  if (!text || AI_STATE.loading) return;

  AI_STATE.messages.push({ role: 'user', content: text });
  AI_STATE.inputVal = '';
  AI_STATE.loading = true;
  AI_STATE.open = true;
  renderAI();

  // Build context from user's current state
  const context = STATE.role ? `The user is currently logged in as a ${STATE.role} on PROPATI. ` : '';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: context + AI_SYSTEM,
        messages: AI_STATE.messages.map(m => ({ role: m.role, content: m.content }))
      })
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Sorry, I had trouble connecting. Please try again.';
    AI_STATE.messages.push({ role: 'assistant', content: reply });
  } catch(e) {
    AI_STATE.messages.push({ role: 'assistant', content: "Sorry, I can't connect right now. Please check your connection and try again." });
  }

  AI_STATE.loading = false;
  renderAI();
}

async function loadConversations() {
  if (DATA.loading.conversations) return;
  DATA.loading.conversations = true;
  render();
  const res = await apiCall('GET', '/messages/conversations').catch(() => null);
  DATA.loading.conversations = false;
  if (res && res.ok) DATA.conversations = res.data.conversations || res.data || [];
  else DATA.conversations = [];
  render();
}

async function loadMessages(convId) {
  if (!convId) return;
  DATA.loading.messages = true;
  const res = await apiCall('GET', `/messages/conversations/${convId}/messages`).catch(() => null);
  DATA.loading.messages = false;
  if (res && res.ok) {
    DATA.convMessages = res.data.messages || res.data || [];
  } else {
    DATA.convMessages = [];
  }
  // Scroll to bottom after load
  render();
  setTimeout(() => {
    const list = document.getElementById('msg-list');
    if (list) list.scrollTop = list.scrollHeight;
  }, 50);
}

  // Create or fetch the conversation
  const res = await apiCall('POST', '/messages/conversations', {
    landlord_id:    landlordId,
    listing_id:     listingId,
    property_title: listingTitle,
    initial_message: `Hi! I'm interested in your property: ${listingTitle}. Is it still available?`,
  }).catch(() => null);

  if (res && res.ok) {
    const conv = res.data.conversation || res.data;
    DATA.activeConv = conv;
    // Reload conversations list
    const listRes = await apiCall('GET', '/messages/conversations').catch(() => null);
    if (listRes && listRes.ok) DATA.conversations = listRes.data.conversations || listRes.data || [];
    await loadMessages(conv.id);
    startMsgPolling(conv.id);
  } else {
    showToast('⚠️ Could not open conversation');
  }
  render();
}

async function sendMessage() {
  const inp   = document.getElementById('msg-input');
  const text  = inp?.value?.trim();
  const conv  = DATA.activeConv;
  if (!text || !conv) return;

  // Optimistic append
  const myId = Auth.getUser()?.id;
  DATA.convMessages.push({
    id: 'tmp-' + Date.now(),
    sender_id: myId,
    content: text,
    created_at: new Date().toISOString(),
    is_read: false,
  });
  inp.value = '';
  render();
  setTimeout(() => {
    const list = document.getElementById('msg-list');
    if (list) list.scrollTop = list.scrollHeight;
  }, 30);

  // Send to backend
  const res = await apiCall('POST', `/messages/conversations/${conv.id}/messages`, {
    content: text,
  }).catch(() => null);

  if (!res || !res.ok) {
    showToast('⚠️ Message failed to send — check your connection');
    // Remove optimistic message
    DATA.convMessages = DATA.convMessages.filter(m => !m.id.toString().startsWith('tmp-'));
    render();
  } else {
    // Replace optimistic with real
    await loadMessages(conv.id);
    // Update last message in conversation list
    if (DATA.conversations) {
      const idx = DATA.conversations.findIndex(c => c.id === conv.id);
      if (idx !== -1) {
        DATA.conversations[idx].last_message    = text;
        DATA.conversations[idx].last_message_at = new Date().toISOString();
      }
    }
  }
}

function startMsgPolling(convId) {
  stopMsgPolling(); // clear any existing
  STATE.msgPollHandle = setInterval(async () => {
    if (!DATA.activeConv || DATA.activeConv.id !== convId) { stopMsgPolling(); return; }
    const res = await apiCall('GET', `/messages/conversations/${convId}/messages`).catch(() => null);
    if (res && res.ok) {
      const newMsgs = res.data.messages || res.data || [];
      // Only re-render if new messages arrived (avoid flicker)
      if (newMsgs.length !== DATA.convMessages.length) {
        DATA.convMessages = newMsgs;
        // Preserve scroll position if user scrolled up
        const list = document.getElementById('msg-list');
        const atBottom = list ? list.scrollHeight - list.scrollTop - list.clientHeight < 60 : true;
        render();
        if (atBottom) setTimeout(() => {
          const l = document.getElementById('msg-list');
          if (l) l.scrollTop = l.scrollHeight;
        }, 30);
      }
    }
  }, 4000);
}

function stopMsgPolling() {
  if (STATE.msgPollHandle) { clearInterval(STATE.msgPollHandle); STATE.msgPollHandle = null; }
}

function filterConversations(query) {
  const items = document.querySelectorAll('#conv-list > div[data-action="open-conversation"]');
  items.forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(query.toLowerCase()) ? '' : 'none';
  });
}

// MORTGAGE CALCULATOR LOGIC
// ════════════════════════════════
function calcMortgage() {
  const priceEl = document.getElementById('mc-price');
  const downEl  = document.getElementById('mc-down');
  const rateEl  = document.getElementById('mc-rate');
  const tenureEl= document.getElementById('mc-tenure');
  if (!priceEl) return; // not on mortgage page

  const price  = parseFloat(priceEl.value)  || 0;
  const downPct= parseFloat(downEl.value)   || 20;
  const rate   = parseFloat(rateEl.value)   || 18;
  const tenure = parseFloat(tenureEl.value) || 15;

  const down     = price * downPct / 100;
  const loan     = price - down;
  const r        = (rate / 100) / 12;
  const n        = tenure * 12;
  const monthly  = loan * r * Math.pow(1+r,n) / (Math.pow(1+r,n) - 1);
  const totalPay = monthly * n;
  const totalInt = totalPay - loan;
  const minIncome= monthly / 0.3;

  const fmt = v => '₦' + (v >= 1000000
    ? (v / 1000000).toFixed(1) + 'M'
    : Math.round(v).toLocaleString());

  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('mc-monthly',  fmt(monthly));
  set('mc-loan',     fmt(loan));
  set('mc-interest', fmt(totalInt));
  set('mc-total',    fmt(totalPay));
  const afford = document.getElementById('mc-afford');
  if (afford) afford.innerHTML = '💡 At ' + fmt(monthly) + '/month, you need a minimum monthly income of <strong>' + fmt(minIncome) + '</strong> to qualify (30% rule).';
}

async function signAgreement(agreementId) {
  const btn = document.getElementById('sign-btn-' + agreementId);
  if (btn) { btn.textContent = '⏳ Signing...'; btn.disabled = true; }

  const res = await apiCall('POST', '/agreements/' + agreementId + '/sign', {
    consent: true,
    consent_text: 'I agree to the terms of this tenancy agreement as presented on PROPATI.'
  });

  if (res && res.ok) {
    showToast('✅ Agreement signed! Legally binding e-signature recorded.');
    DATA.agreements = null;
  DATA.receipts = null;
  DATA.tenantProfile = null;
    loadAgreements();
  } else {
    showToast('❌ ' + (res?.data?.error || 'Signing failed'));
    if (btn) { btn.textContent = '✍️ Sign Agreement'; btn.disabled = false; }
  }
}

function viewAgreementPDF(agreementId) {
  const url = API + '/agreements/' + agreementId + '/preview';
  window.open(url, '_blank');
}

function renderAgreementsScreen(role) {
  const agrs = DATA.agreements;
  if (agrs === null) {
    loadAgreements();
    return `<div style="text-align:center;padding:3rem;opacity:0.5">⏳ Loading agreements...</div>`;
  }
  if (!agrs.length) return `
    <div style="text-align:center;padding:3rem">
      <div style="font-size:2rem;margin-bottom:0.8rem">📄</div>
      <div style="font-weight:700;margin-bottom:0.3rem">No agreements yet</div>

        </div>
        <span style="padding:0.2rem 0.7rem;border-radius:100px;font-size:0.68rem;font-weight:700;background:${sc}22;color:${sc}">${sl}</span>
      </div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:0.9rem">
          <div style="background:rgba(0,0,0,0.04);border-radius:8px;padding:0.6rem 0.8rem">
            <div style="font-size:0.67rem;opacity:0.5;text-transform:uppercase;letter-spacing:0.05em">Rent</div>
            <div style="font-weight:800;font-size:0.92rem">${fmtNaira(a.rent_amount)}</div>
            <div style="font-size:0.67rem;opacity:0.5">per ${a.rent_period || 'year'}</div>

            <div style="font-size:0.67rem;opacity:0.5;text-transform:uppercase;letter-spacing:0.05em">Start</div>
            <div style="font-weight:700;font-size:0.85rem">${fmtDate(a.start_date)}</div>

            <div style="font-size:0.67rem;opacity:0.5;text-transform:uppercase;letter-spacing:0.05em">Caution</div>
            <div style="font-weight:700;font-size:0.85rem">${fmtNaira(a.caution_deposit)}</div>
          </div>
        </div>
        <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.7rem">
          <div style="flex:1;font-size:0.78rem">

async function loadTenantProfile() {
  if (DATA.loading.tenantProfile) return;
  DATA.loading.tenantProfile = true;
  const res = await apiCall('GET', '/users/profile');
  DATA.loading.tenantProfile = false;
  if (res && res.ok) {
    DATA.tenantProfile = res.data.user;
    setState({});
  }
}

async function loadReceipts() {
  if (DATA.loading.receipts) return;
  DATA.loading.receipts = true;
  const res = await apiCall('GET', '/users/receipts');
  DATA.loading.receipts = false;
  if (res && res.ok) {
    DATA.receipts = res.data.receipts || [];
    setState({});
  }
}

async function saveTenantProfile() {
  const btn = document.getElementById('save-profile-btn');
  if (btn) { btn.textContent = '⏳ Saving...'; btn.disabled = true; }

  const body = {
    employment_status:     document.getElementById('tp-emp-status')?.value || undefined,
    employment_type:       document.getElementById('tp-emp-type')?.value || undefined,
    employer_name:         document.getElementById('tp-employer')?.value?.trim() || undefined,
    job_title:             document.getElementById('tp-job-title')?.value?.trim() || undefined,
    yearly_income:         parseInt(document.getElementById('tp-income')?.value) || undefined,
    profile_bio:           document.getElementById('tp-bio')?.value?.trim() || undefined,
    guarantor_name:        document.getElementById('tp-guar-name')?.value?.trim() || undefined,
    guarantor_phone:       document.getElementById('tp-guar-phone')?.value?.trim() || undefined,
    guarantor_relationship:document.getElementById('tp-guar-rel')?.value?.trim() || undefined,
  };

  // Also update full_name/phone via profile endpoint
  const fullName = document.getElementById('tp-fullname')?.value?.trim();
  const phone    = document.getElementById('tp-phone')?.value?.trim();
  if (fullName || phone) {
    await apiCall('PATCH', '/users/profile', { full_name: fullName, phone });
  }

  const res = await apiCall('PATCH', '/users/tenant-profile', body);
  if (btn) { btn.textContent = '💾 Save Profile'; btn.disabled = false; }

  if (res && res.ok) {
    DATA.tenantProfile = res.data.user;
    showToast('✅ Profile saved! Landlords can now view your details.');
    setState({});
  } else {
    showToast('❌ ' + (res?.data?.error || 'Failed to save profile'));
  }
}

async function verifyUserIdentity() {
  const type   = document.getElementById('uid-type')?.value;
  const number = document.getElementById('uid-number')?.value?.trim();
  const btn    = document.getElementById('uid-verify-btn');
  const result = document.getElementById('uid-result');

  if (!number) { showToast('⚠️ Please enter your ID number'); return; }

  if (btn) { btn.textContent = '⏳ Verifying...'; btn.disabled = true; }

  const res = await apiCall('POST', '/verification/verify-identity', { type, number });

  if (!res || !res.ok) {
    if (btn) { btn.textContent = '🔍 Verify Identity'; btn.disabled = false; }
    if (result) result.innerHTML = `<div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:0.7rem;color:#ef4444;font-size:0.8rem;font-weight:600;margin-bottom:0.4rem">❌ ${res?.data?.error || 'Could not verify. Check your number and try again.'}</div>`;
    return;
  }

  const d = res.data.data;
  if (result) result.innerHTML = `
    <div style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:8px;padding:0.75rem;margin-bottom:0.4rem">
      <div style="font-weight:700;font-size:0.82rem;color:#15803d;margin-bottom:0.4rem">✅ Match found — Is this you?</div>
      <div style="font-size:0.8rem;font-weight:600">${d.first_name} ${d.middle_name||''} ${d.last_name}</div>
      ${d.dob?`<div style="font-size:0.73rem;color:#6b7280">DOB: ${d.dob}</div>`:''}
      <div style="display:flex;gap:0.5rem;margin-top:0.6rem">
        <button onclick="confirmUserIdentity('${type}')" style="flex:1;padding:0.5rem;background:#15803d;color:white;border:none;border-radius:7px;font-weight:700;font-size:0.78rem;cursor:pointer;font-family:Outfit,sans-serif">✅ Yes, that's me</button>
        <button onclick="document.getElementById('uid-result').innerHTML='';document.getElementById('uid-verify-btn').disabled=false;document.getElementById('uid-verify-btn').textContent='🔍 Verify Identity'" style="padding:0.5rem 0.8rem;background:transparent;border:1px solid #d1d5db;border-radius:7px;font-size:0.78rem;cursor:pointer;font-family:Outfit,sans-serif">Not me</button>
      </div>
    </div>`;
  if (btn) { btn.textContent = '🔍 Verify Identity'; btn.disabled = false; }
}

async function confirmUserIdentity(type) {
  // For user-level verification (not property), just mark the user as verified
  const res = await apiCall('POST', '/verification/verify-identity', {
    type,
    number: document.getElementById('uid-number')?.value?.trim()
  });

  if (res && res.ok) {
    // Update local user cache
    const user = Auth.getUser();
    if (user) {
      if (type === 'nin') user.nin_verified = true;
      else user.id_verified = true;
      Auth.save(Auth.getAccess(), Auth.getRefresh(), user);
    }
    showToast('✅ Identity verified! Your profile now shows a Verified badge.');
    document.getElementById('uid-result').innerHTML = '';
    setState({});
  } else {
    showToast('❌ ' + (res?.data?.error || 'Confirmation failed'));
  }
}

async function updateLandlordProfile() {
  const name  = document.getElementById('ll-name')?.value?.trim();
  const phone = document.getElementById('ll-phone')?.value?.trim();
  if (!name) { showToast('⚠️ Name required'); return; }
  const res = await apiCall('PATCH', '/users/profile', { full_name: name, phone });
  if (res && res.ok) {
    const user = Auth.getUser();
    if (user) { user.full_name = name; if (phone) user.phone = phone; Auth.save(Auth.getAccess(), Auth.getRefresh(), user); }
    showToast('✅ Profile updated');
    setState({});
  } else {
    showToast('❌ ' + (res?.data?.error || 'Update failed'));
  }
}

// ════════════════════════════════════════════════════════
// FORGOT PASSWORD
// ════════════════════════════════════════════════════════
async function doForgotPassword() {
  const email = document.getElementById('forgot-email')?.value?.trim();
  if (!email) { setState({ authError: 'Please enter your email' }); return; }

  setState({ authLoading: true, authError: '', forgotSuccess: '' });
  const res = await apiCall('POST', '/auth/forgot-password', { email });
  setState({ authLoading: false });

  if (res) {
    setState({ forgotSuccess: res.data?.message || 'Reset link sent! Check your inbox and spam folder.' });
  } else {
    setState({ authError: 'Something went wrong. Please try again.' });
  }
}

async function sendPhoneOTP() {
  const btn = document.getElementById('send-otp-btn');
  if (btn) { btn.textContent = '⏳ Sending...'; btn.disabled = true; }

  const res = await apiCall('POST', '/auth/send-phone-otp', {});
  if (btn) { btn.textContent = '📱 Resend OTP'; btn.disabled = false; }

  if (res && res.ok) {
    showToast('✅ OTP sent via WhatsApp! Check your messages.');
    document.getElementById('otp-section')?.style && (document.getElementById('otp-section').style.display = 'block');
  } else {
    showToast('❌ ' + (res?.data?.error || 'Could not send OTP'));
  }
}

async function verifyPhoneOTP() {
  const otp = document.getElementById('phone-otp')?.value?.trim();
  if (!otp) { showToast('⚠️ Enter the OTP you received'); return; }

  const btn = document.getElementById('verify-otp-btn');
  if (btn) { btn.textContent = '⏳ Verifying...'; btn.disabled = true; }

  const res = await apiCall('POST', '/auth/verify-phone', { otp });
  if (btn) { btn.textContent = '✅ Verify'; btn.disabled = false; }

  if (res && res.ok) {
    // Update local user
    const user = Auth.getUser();
    if (user) { user.phone_verified = true; Auth.save(Auth.getAccess(), Auth.getRefresh(), user); }
    showToast('✅ Phone verified!');
    setState({});
  } else {
    showToast('❌ ' + (res?.data?.error || 'Incorrect OTP'));
  }
}

}

function toggleEMSidebar() {
  const sidebar = document.querySelector('.em-sidebar');
  if (!sidebar) return;
  let overlay = document.getElementById('emSidebarOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'emSidebarOverlay';
    overlay.className = 'sidebar-overlay';
    overlay.onclick = toggleEMSidebar;
    document.body.appendChild(overlay);
  }
  const isOpen = sidebar.classList.toggle('open');
  overlay.classList.toggle('visible', isOpen);
  document.body.style.overflow = isOpen ? 'hidden' : '';
}

// Close sidebar on nav item click (mobile)
document.addEventListener('click', function(e) {
  const navItem = e.target.closest('.nav-item, .em-nav-item');
  if (navItem) {
    const sidebar = document.getElementById('mainSidebar');
    const emSidebar = document.querySelector('.em-sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const emOverlay = document.getElementById('emSidebarOverlay');
    if (sidebar && window.innerWidth <= 768) {
      sidebar.classList.remove('open');
      if (overlay) overlay.classList.remove('visible');
      document.body.style.overflow = '';
    }
    if (emSidebar && window.innerWidth <= 768) {
      emSidebar.classList.remove('open');
      if (emOverlay) emOverlay.classList.remove('visible');
      document.body.style.overflow = '';
    }
  }
});

// Mobile: reset overflow on nav
document.addEventListener("click", function(e){ if(e.target.closest("[data-action]")) document.body.style.overflow=""; });

</script>
</body>
