<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PROPATI — Property Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&family=Epilogue:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ════════════════════════════════
   SHARED DESIGN TOKENS
════════════════════════════════ */
:root{
  /* Landlord theme (dark) */
  --l-bg:#0f0f0f; --l-surface:#181818; --l-surface2:#222; --l-surface3:#2a2a2a;
  --l-border:rgba(255,255,255,0.08); --l-text:#f5f4f0; --l-muted:#888680;
  --l-accent:#d4622a; --l-accent2:#e8834e; --l-glow:rgba(212,98,42,0.18);

  /* Tenant theme (light warm) */
  --t-bg:#f7f5f0; --t-surface:#fff; --t-surface2:#efefea; --t-border:rgba(17,17,16,0.09);
  --t-text:#111110; --t-muted:#7a7870; --t-accent:#0e7c6a; --t-accent2:#14a88e;

  /* Agent theme (navy/gold) */
  --a-bg:#0d1b2e; --a-surface:#0f1e33; --a-surface2:#1a2f50; --a-border:rgba(248,246,240,0.07);
  --a-text:#f8f6f0; --a-muted:#7a8fa8; --a-accent:#c9952a; --a-accent2:#e0b04a;

  /* Shared */
  --green:#2aad72; --green-bg:rgba(42,173,114,0.1);
  --red:#d44040; --red-bg:rgba(212,64,64,0.1);
  --amber:#c8920a; --amber-bg:rgba(200,146,10,0.1);
  --blue:#3a7cd4; --blue-bg:rgba(58,124,212,0.1);
}

html,body{height:100%;overflow:hidden;font-size:14px}
body{font-family:'Outfit',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,0.3);border-radius:100px}

/* ════════════════════════════════
   APP SHELL
════════════════════════════════ */
#app{height:100vh;display:flex;flex-direction:column}

/* ════════════════════════════════
   LOGIN SCREEN
════════════════════════════════ */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a0a0a;position:relative;overflow:hidden;
}
.login-bg-grad{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 700px 500px at 20% 50%, rgba(212,98,42,0.08),transparent),
    radial-gradient(ellipse 600px 500px at 80% 50%, rgba(14,124,106,0.06),transparent),
    radial-gradient(ellipse 500px 400px at 50% 80%, rgba(201,149,42,0.05),transparent);
}
.login-grid-bg{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:50px 50px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);
}
.login-box{
  position:relative;z-index:1;width:100%;max-width:420px;padding:0 1.5rem;
}
.login-brand{
  text-align:center;margin-bottom:2.5rem;
}
.login-logo{
  font-family:'DM Serif Display',serif;font-size:3rem;letter-spacing:0.02em;color:#f8f6f0;
}
.login-logo span{color:#c9952a}
.login-tagline{font-size:0.82rem;color:#4a5f78;margin-top:0.3rem}

.login-card{
  background:#0f1e33;border:1px solid rgba(248,246,240,0.1);
  border-radius:20px;padding:2rem;
}
.login-title{font-family:'Bricolage Grotesque',sans-serif;font-size:1.3rem;font-weight:800;color:#f8f6f0;margin-bottom:0.3rem}
.login-sub{font-size:0.8rem;color:#4a5f78;margin-bottom:1.6rem}

.role-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1.5rem}
.role-btn{
  padding:0.9rem 0.5rem;border-radius:12px;
  border:2px solid rgba(248,246,240,0.08);
  background:rgba(248,246,240,0.03);
  cursor:pointer;text-align:center;transition:all .2s;
}
.role-btn:hover{border-color:rgba(201,149,42,0.3);background:rgba(201,149,42,0.05)}
.role-btn.selected{border-color:#c9952a;background:rgba(201,149,42,0.1)}
.rb-icon{font-size:1.5rem;display:block;margin-bottom:0.4rem}
.rb-label{font-size:0.78rem;font-weight:700;color:#f8f6f0;display:block}
.rb-sub{font-size:0.65rem;color:#4a5f78;display:block;margin-top:1px}

.inp-group{margin-bottom:1rem}
.inp-label{display:block;font-size:0.75rem;font-weight:600;color:#4a5f78;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.07em}
.inp-field{
  width:100%;background:rgba(255,255,255,0.04);border:1.5px solid rgba(248,246,240,0.1);
  border-radius:10px;padding:0.8rem 1rem;color:#f8f6f0;
  font-family:'Outfit',sans-serif;font-size:0.88rem;outline:none;transition:border-color .2s;
}
.inp-field:focus{border-color:#c9952a}
.inp-field::placeholder{color:#2a3f58}

.btn-login{
  width:100%;padding:0.9rem;border-radius:12px;border:none;
  background:linear-gradient(135deg,#c9952a,#e0b04a);
  color:#0d1b2e;font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:800;
  cursor:pointer;transition:all .2s;margin-top:0.5rem;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,149,42,0.3)}
.btn-login:active{transform:translateY(0)}

.login-demo{
  text-align:center;margin-top:1.4rem;
  font-size:0.76rem;color:#2a3f58;
}
.demo-link{color:#c9952a;cursor:pointer;text-decoration:underline;font-weight:600}

.role-accounts{
  margin-top:1.4rem;border-top:1px solid rgba(248,246,240,0.07);padding-top:1.2rem;
  display:flex;flex-direction:column;gap:0.5rem;
}
.demo-account{
  display:flex;align-items:center;gap:0.8rem;
  padding:0.7rem 0.9rem;border-radius:10px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(248,246,240,0.06);
  cursor:pointer;transition:all .18s;
}
.demo-account:hover{background:rgba(201,149,42,0.07);border-color:rgba(201,149,42,0.2)}
.da-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;flex-shrink:0}
.da-name{font-size:0.82rem;font-weight:600;color:#f8f6f0}
.da-role{font-size:0.7rem;color:#4a5f78}
.da-arrow{margin-left:auto;color:#4a5f78;font-size:0.8rem}

/* ════════════════════════════════
   SHARED LAYOUT SHELL
════════════════════════════════ */
.app-layout{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  flex-shrink:0;display:flex;flex-direction:column;
  height:100vh;overflow-y:auto;transition:width .3s;
}
.sb-header{padding:1.4rem 1.2rem 1rem;border-bottom:1px solid;display:flex;align-items:center;justify-content:space-between}
.sb-logo{font-family:'DM Serif Display',serif;font-size:1.4rem;letter-spacing:0.01em}
.sb-user-card{margin:0.8rem;border-radius:14px;padding:1rem 1.1rem}
.su-row{display:flex;align-items:center;gap:0.8rem}
.su-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;flex-shrink:0}
.su-name{font-size:0.85rem;font-weight:700}
.su-sub{font-size:0.71rem;margin-top:1px}
.sb-nav{flex:1;padding:0.5rem 0.8rem}
.nav-section{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:0.9rem 0.6rem 0.3rem}
.nav-item{
  display:flex;align-items:center;gap:0.75rem;
  padding:0.62rem 0.75rem;border-radius:10px;
  font-size:0.84rem;font-weight:500;cursor:pointer;transition:all .18s;margin-bottom:2px;
  position:relative;
}
.nav-icon{font-size:0.95rem;flex-shrink:0;width:18px;text-align:center}
.nav-badge{margin-left:auto;font-size:0.62rem;font-weight:800;padding:0.1rem 0.42rem;border-radius:100px}
.sb-footer{padding:0.8rem;border-top:1px solid}
.switch-role-btn{
  width:100%;padding:0.6rem 0.9rem;border-radius:10px;border:none;
  font-family:'Outfit',sans-serif;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;gap:0.5rem;
}

/* ── MAIN CONTENT ── */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  padding:0.9rem 1.8rem;border-bottom:1px solid;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.topbar-left .page-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.1rem}
.topbar-left .page-sub{font-size:0.73rem;margin-top:1px}
.topbar-right{display:flex;gap:0.6rem;align-items:center}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.85rem;
  transition:all .18s;position:relative;
}
.notif-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;border:1.5px solid}
.btn-primary{
  padding:0.55rem 1.1rem;border-radius:9px;border:none;
  font-size:0.82rem;font-weight:700;cursor:pointer;
  font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:0.4rem;transition:all .18s;
}
.btn-primary:hover{transform:translateY(-1px)}

.content-area{flex:1;overflow-y:auto;padding:1.6rem 1.8rem}

/* ════════════════════════════════
   LANDLORD THEME
════════════════════════════════ */
.theme-landlord{background:var(--l-bg);color:var(--l-text)}
.theme-landlord .sidebar{background:var(--l-surface);width:220px;border-right:1px solid var(--l-border)}
.theme-landlord .sb-header{border-bottom-color:var(--l-border)}
.theme-landlord .sb-logo .lp{color:var(--l-accent)}
.theme-landlord .sb-user-card{background:var(--l-surface2);border:1px solid var(--l-border)}
.theme-landlord .su-av{background:linear-gradient(135deg,var(--l-accent),var(--amber))}
.theme-landlord .su-sub{color:var(--l-muted)}
.theme-landlord .nav-section{color:#444}
.theme-landlord .nav-item{color:var(--l-muted)}
.theme-landlord .nav-item:hover{background:var(--l-surface2);color:var(--l-text)}
.theme-landlord .nav-item.active{background:var(--l-glow);color:var(--l-accent);font-weight:600}
.theme-landlord .nav-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--l-accent);border-radius:100px}
.theme-landlord .nav-badge{background:var(--l-accent);color:white}
.theme-landlord .sb-footer{border-top-color:var(--l-border)}
.theme-landlord .switch-role-btn{background:var(--l-surface2);color:var(--l-muted);border:1px solid var(--l-border)}
.theme-landlord .topbar,.theme-landlord .main-area{background:var(--l-surface)}
.theme-landlord .topbar{border-bottom-color:var(--l-border)}
.theme-landlord .topbar-left .page-sub{color:var(--l-muted)}
.theme-landlord .icon-btn{background:var(--l-surface2);border-color:var(--l-border);color:var(--l-text)}
.theme-landlord .notif-dot{background:var(--l-accent);border-color:var(--l-surface)}
.theme-landlord .btn-primary{background:var(--l-accent);color:white}
.theme-landlord .btn-primary:hover{background:var(--l-accent2)}
.theme-landlord .content-area{background:var(--l-bg)}

/* ════════════════════════════════
   TENANT THEME
════════════════════════════════ */
.theme-tenant{background:var(--t-bg);color:var(--t-text)}
.theme-tenant .sidebar{background:var(--t-surface);width:230px;border-right:1px solid var(--t-border)}
.theme-tenant .sb-header{border-bottom-color:var(--t-border)}
.theme-tenant .sb-logo .lp{color:#c4511c}
.theme-tenant .sb-user-card{background:linear-gradient(135deg,var(--t-accent),var(--t-accent2));color:white}
.theme-tenant .su-av{background:rgba(255,255,255,0.25);color:white}
.theme-tenant .su-sub{opacity:0.75}
.theme-tenant .nav-section{color:#c0bdb6}
.theme-tenant .nav-item{color:var(--t-muted)}
.theme-tenant .nav-item:hover{background:var(--t-bg);color:var(--t-text)}
.theme-tenant .nav-item.active{background:rgba(14,124,106,0.08);color:var(--t-accent);font-weight:600}
.theme-tenant .nav-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--t-accent);border-radius:100px}
.theme-tenant .nav-badge{background:#c4511c;color:white}
.theme-tenant .sb-footer{border-top-color:var(--t-border)}
.theme-tenant .switch-role-btn{background:var(--t-bg);color:var(--t-muted);border:1px solid var(--t-border)}
.theme-tenant .topbar,.theme-tenant .main-area{background:var(--t-surface)}
.theme-tenant .topbar{border-bottom-color:var(--t-border)}
.theme-tenant .topbar-left .page-sub{color:var(--t-muted)}
.theme-tenant .icon-btn{background:var(--t-bg);border-color:var(--t-border);color:var(--t-text)}
.theme-tenant .notif-dot{background:#c4511c;border-color:var(--t-surface)}
.theme-tenant .btn-primary{background:var(--t-accent);color:white}
.theme-tenant .btn-primary:hover{background:var(--t-accent2)}
.theme-tenant .content-area{background:var(--t-bg)}

/* ════════════════════════════════
   AGENT THEME
════════════════════════════════ */
.theme-agent{background:var(--a-bg);color:var(--a-text)}
.theme-agent .sidebar{background:var(--a-surface);width:240px;border-right:1px solid var(--a-border)}
.theme-agent .sb-header{border-bottom-color:var(--a-border)}
.theme-agent .sb-logo{font-family:'DM Serif Display',serif}
.theme-agent .sb-logo .lp{color:var(--a-accent)}
.theme-agent .sb-user-card{background:linear-gradient(135deg,#122240,#1a2f50);border:1px solid rgba(201,149,42,0.25)}
.theme-agent .su-av{background:linear-gradient(135deg,var(--a-accent),var(--a-accent2));color:#0d1b2e}
.theme-agent .su-sub{color:var(--a-muted)}
.theme-agent .nav-section{color:#243850}
.theme-agent .nav-item{color:var(--a-muted)}
.theme-agent .nav-item:hover{background:#122240;color:var(--a-text)}
.theme-agent .nav-item.active{background:rgba(201,149,42,0.12);color:var(--a-accent);font-weight:600}
.theme-agent .nav-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--a-accent);border-radius:100px}
.theme-agent .nav-badge{background:var(--a-accent);color:#0d1b2e}
.theme-agent .sb-footer{border-top-color:var(--a-border)}
.theme-agent .switch-role-btn{background:#122240;color:var(--a-muted);border:1px solid var(--a-border)}
.theme-agent .topbar,.theme-agent .main-area{background:var(--a-surface)}
.theme-agent .topbar{border-bottom-color:var(--a-border)}
.theme-agent .topbar-left .page-sub{color:var(--a-muted)}
.theme-agent .icon-btn{background:#122240;border-color:var(--a-border);color:var(--a-text)}
.theme-agent .notif-dot{background:var(--a-accent);border-color:var(--a-surface)}
.theme-agent .btn-primary{background:var(--a-accent);color:#0d1b2e;font-weight:800}
.theme-agent .btn-primary:hover{background:var(--a-accent2)}
.theme-agent .content-area{background:var(--a-bg)}

/* ════════════════════════════════
   SHARED UI COMPONENTS
════════════════════════════════ */
.card{border-radius:14px;border:1px solid}
.theme-landlord .card{background:var(--l-surface);border-color:var(--l-border)}
.theme-tenant .card{background:var(--t-surface);border-color:var(--t-border)}
.theme-agent .card{background:var(--a-surface);border-color:var(--a-border)}

.card-head{padding:1rem 1.3rem;border-bottom:1px solid;display:flex;align-items:center;justify-content:space-between}
.theme-landlord .card-head{border-bottom-color:var(--l-border)}
.theme-tenant .card-head{border-bottom-color:var(--t-border)}
.theme-agent .card-head{border-bottom-color:var(--a-border)}

.card-title{font-weight:700;font-size:0.87rem}
.card-body{padding:1.1rem 1.3rem}

.tag{font-size:0.67rem;font-weight:700;padding:0.16rem 0.5rem;border-radius:100px;text-transform:uppercase;letter-spacing:0.04em;display:inline-block}
.tag-green{background:var(--green-bg);color:var(--green)}
.tag-amber{background:var(--amber-bg);color:var(--amber)}
.tag-red{background:var(--red-bg);color:var(--red)}
.tag-blue{background:var(--blue-bg);color:var(--blue)}
.tag-rust{background:rgba(212,98,42,0.1);color:#d4622a}
.tag-teal{background:rgba(14,124,106,0.1);color:#0e7c6a}
.tag-gold{background:rgba(201,149,42,0.12);color:#c9952a}
.tag-muted{background:rgba(128,128,128,0.1);color:#888}

.stat-num{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-0.02em}
.serif-num{font-family:'DM Serif Display',serif;letter-spacing:0.01em}

/* Progress bar */
.prog-wrap{margin-top:0.8rem}
.prog-bar{height:5px;border-radius:100px;overflow:hidden}
.theme-landlord .prog-bar{background:var(--l-surface3)}
.theme-tenant .prog-bar{background:var(--t-surface2)}
.theme-agent .prog-bar{background:#122240}
.prog-fill{height:100%;border-radius:100px}
.prog-fill-green{background:linear-gradient(90deg,var(--green),#4ad4a8)}
.prog-fill-gold{background:linear-gradient(90deg,var(--a-accent),var(--a-accent2))}
.prog-fill-teal{background:linear-gradient(90deg,var(--t-accent),var(--t-accent2))}

/* Avatar */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.av-rust{background:linear-gradient(135deg,#d4622a,var(--amber))}
.av-teal{background:linear-gradient(135deg,#0e7c6a,#14a88e)}
.av-gold{background:linear-gradient(135deg,#c9952a,#e0b04a);color:#0d1b2e}
.av-blue{background:linear-gradient(135deg,var(--blue),#6a4ad4);color:white}
.av-green{background:linear-gradient(135deg,var(--green),#4ad4a8);color:white}
.av-purple{background:linear-gradient(135deg,#8b5cf6,#d4622a);color:white}

/* Action buttons */
.act-btn{padding:0.28rem 0.6rem;border-radius:7px;font-size:0.71rem;font-weight:600;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all .15s}

/* Divider */
.theme-landlord .div-line{border-top:1px solid var(--l-border)}
.theme-tenant .div-line{border-top:1px solid var(--t-border)}
.theme-agent .div-line{border-top:1px solid var(--a-border)}

/* Inputs */
.field-inp{
  width:100%;border-radius:9px;padding:0.72rem 0.9rem;
  font-family:'Outfit',sans-serif;font-size:0.86rem;outline:none;transition:border-color .18s;border:1.5px solid;
}
.theme-landlord .field-inp{background:var(--l-surface2);border-color:var(--l-border);color:var(--l-text)}
.theme-landlord .field-inp:focus{border-color:var(--l-accent)}
.theme-tenant .field-inp{background:var(--t-bg);border-color:var(--t-border);color:var(--t-text)}
.theme-tenant .field-inp:focus{border-color:var(--t-accent)}
.theme-agent .field-inp{background:#122240;border-color:var(--a-border);color:var(--a-text)}
.theme-agent .field-inp:focus{border-color:rgba(201,149,42,0.5)}
.field-inp::placeholder{color:#888}

.field-lbl{display:block;font-size:0.74rem;font-weight:600;margin-bottom:0.38rem;text-transform:uppercase;letter-spacing:0.07em}
.theme-landlord .field-lbl{color:var(--l-muted)}
.theme-tenant .field-lbl{color:var(--t-muted)}
.theme-agent .field-lbl{color:var(--a-muted)}
.fg{margin-bottom:1rem}

/* Grid helpers */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.dash-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:1.2rem}
.flex-row{display:flex;align-items:center;gap:0.7rem}
.flex-between{display:flex;align-items:center;justify-content:space-between}

/* ════════════════════════════════
   ROLE-SWITCH MODAL
════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  background:#0f1e33;border:1px solid rgba(201,149,42,0.2);
  border-radius:20px;padding:2rem;width:400px;
  transform:translateY(20px) scale(0.97);transition:transform .2s;
}
.modal-overlay.open .modal-box{transform:none}
.modal-title{font-family:'DM Serif Display',serif;font-size:1.3rem;color:#f8f6f0;margin-bottom:0.3rem}
.modal-sub{font-size:0.79rem;color:#4a5f78;margin-bottom:1.4rem}
.switch-option{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.9rem 1rem;border-radius:12px;
  border:2px solid rgba(248,246,240,0.07);
  cursor:pointer;transition:all .18s;margin-bottom:0.6rem;background:rgba(255,255,255,0.02);
}
.switch-option:hover{border-color:rgba(201,149,42,0.35);background:rgba(201,149,42,0.05)}
.switch-option.current{border-color:rgba(201,149,42,0.5);background:rgba(201,149,42,0.08)}
.so-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.so-name{font-weight:700;font-size:0.9rem;color:#f8f6f0}
.so-desc{font-size:0.73rem;color:#4a5f78}
.so-check{margin-left:auto;color:#c9952a;font-size:1rem}

/* ════════════════════════════════
   TOAST
════════════════════════════════ */
.toast{
  position:fixed;bottom:1.6rem;right:1.6rem;z-index:9999;
  border-radius:12px;padding:0.85rem 1.2rem;
  display:flex;align-items:center;gap:0.7rem;
  max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,0.3);
  transform:translateY(80px);opacity:0;transition:all .28s cubic-bezier(.34,1.56,.64,1);
}
.toast.show{transform:translateY(0);opacity:1}
.theme-landlord .toast{background:var(--l-surface2);border:1px solid var(--l-border);color:var(--l-text)}
.theme-tenant .toast{background:var(--t-text);border:1px solid rgba(0,0,0,0.1);color:var(--t-surface)}
.theme-agent .toast{background:var(--a-surface2);border:1px solid rgba(201,149,42,0.2);color:var(--a-text)}
.toast-text{font-size:0.82rem;font-weight:500}

/* ════════════════════════════════
   LANDLORD SCREENS
════════════════════════════════ */
.l-hero{
  background:linear-gradient(135deg,#1a1a1a,#252525);
  border:1px solid var(--l-border);border-radius:18px;padding:1.6rem;
  margin-bottom:1.3rem;position:relative;overflow:hidden;
}
.l-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(212,98,42,0.12),transparent 70%)}
.l-hero-title{font-family:'Bricolage Grotesque',sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;position:relative;z-index:1}
.l-hero-sub{font-size:0.8rem;color:var(--l-muted);margin-top:0.3rem;position:relative;z-index:1}
.l-stats-row{display:flex;gap:2rem;margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid var(--l-border);position:relative;z-index:1}
.ls-item .lsv{font-family:'Bricolage Grotesque',sans-serif;font-size:1.4rem;font-weight:800}
.ls-item .lsl{font-size:0.71rem;color:var(--l-muted);margin-top:1px}

.prop-row-item{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.75rem 0;border-bottom:1px solid var(--l-border);
  cursor:pointer;transition:all .18s;border-radius:8px;
}
.prop-row-item:last-child{border-bottom:none}
.prop-row-item:hover{background:var(--l-surface2);padding-left:8px}
.prop-thumb{width:42px;height:42px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.pt-a{background:linear-gradient(135deg,#2a1a0a,#4a3010)}
.pt-b{background:linear-gradient(135deg,#0a1a2a,#103040)}
.pt-c{background:linear-gradient(135deg,#1a2a0a,#2a4010)}
.pt-d{background:linear-gradient(135deg,#2a0a1a,#401030)}
.pi-name{font-weight:600;font-size:0.84rem}
.pi-meta{display:flex;gap:0.4rem;margin-top:0.3rem;flex-wrap:wrap}
.pi-price{text-align:right}
.pi-val{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:0.88rem}
.pi-period{font-size:0.68rem;color:var(--l-muted)}

/* Rent table */
.rent-row-item{display:flex;align-items:center;gap:0.8rem;padding:0.7rem 0;border-bottom:1px solid var(--l-border)}
.rent-row-item:last-child{border-bottom:none}
.rri-info{flex:1}
.rri-name{font-size:0.82rem;font-weight:600}
.rri-unit{font-size:0.71rem;color:var(--l-muted)}
.rri-val{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:0.86rem;text-align:right}
.rri-date{font-size:0.68rem;color:var(--l-muted);text-align:right}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sd-green{background:var(--green)}
.sd-amber{background:var(--amber)}
.sd-red{background:var(--red)}

/* ════════════════════════════════
   TENANT SCREENS
════════════════════════════════ */
.t-hero{
  background:linear-gradient(135deg,var(--t-accent),var(--t-accent2),#1cc4a4);
  border-radius:18px;padding:1.8rem;color:white;margin-bottom:1.3rem;
  position:relative;overflow:hidden;
}
.t-hero::before{content:'';position:absolute;right:-50px;top:-50px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.06)}
.t-hero-grid{font-size:0.8rem;opacity:0.75;margin-bottom:0.3rem}
.t-hero-name{font-family:'Bricolage Grotesque',sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:-0.02em;position:relative;z-index:1}
.t-hero-prop{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,0.2);display:flex;gap:1.8rem;position:relative;z-index:1}
.thp-item .thp-lbl{font-size:0.69rem;opacity:0.7;margin-bottom:0.15rem}
.thp-item .thp-val{font-weight:700;font-size:0.9rem}
.t-countdown{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:12px;padding:0.6rem 1rem;text-align:center;flex-shrink:0;position:relative;z-index:1}
.tc-days{font-family:'Bricolage Grotesque',sans-serif;font-size:1.8rem;font-weight:800;line-height:1}
.tc-lbl{font-size:0.68rem;opacity:0.75;margin-top:0.15rem}

.t-act-item{display:flex;gap:0.8rem;padding:0.7rem 0;border-bottom:1px solid var(--t-border)}
.t-act-item:last-child{border-bottom:none}
.t-act-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;flex-shrink:0}
.t-act-title{font-size:0.82rem;font-weight:600;margin-bottom:0.12rem}
.t-act-sub{font-size:0.72rem;color:var(--t-muted)}
.t-act-time{font-size:0.68rem;color:#c0bdb6;flex-shrink:0;margin-left:auto;padding-top:1px}

/* Listings for tenant */
.prop-card-t{
  background:var(--t-surface);border:1px solid var(--t-border);
  border-radius:14px;overflow:hidden;cursor:pointer;transition:all .22s;
}
.prop-card-t:hover{transform:translateY(-4px);box-shadow:0 10px 32px rgba(17,17,16,0.08)}
.pct-img{height:150px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.pct-body{padding:0.9rem}
.pct-price{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-0.01em}
.pct-title{font-size:0.83rem;font-weight:600;margin-top:0.15rem}
.pct-loc{font-size:0.74rem;color:var(--t-muted);margin-top:0.1rem}
.pct-meta{display:flex;gap:0.7rem;margin-top:0.65rem;padding-top:0.65rem;border-top:1px solid var(--t-border);font-size:0.72rem;color:var(--t-muted)}
.apply-btn-t{
  width:100%;margin-top:0.7rem;padding:0.6rem;border-radius:8px;
  background:rgba(14,124,106,0.08);color:var(--t-accent);
  border:1.5px solid rgba(14,124,106,0.2);
  font-size:0.8rem;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .18s;
}
.apply-btn-t:hover{background:var(--t-accent);color:white}

/* Maintenance */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;margin-bottom:1rem}
.cat-chip{border:1.5px solid var(--t-border);border-radius:10px;padding:0.7rem 0.4rem;text-align:center;cursor:pointer;transition:all .18s;background:var(--t-bg)}
.cat-chip.on,.cat-chip:hover{border-color:var(--t-accent);background:rgba(14,124,106,0.06)}
.cat-chip .ci{font-size:1.3rem;display:block;margin-bottom:0.25rem}
.cat-chip .cl{font-size:0.72rem;font-weight:600;color:var(--t-muted)}
.cat-chip.on .cl{color:var(--t-accent)}
.prio-row{display:flex;gap:0.5rem;margin-top:0.4rem;margin-bottom:1rem}
.prio-btn{flex:1;padding:0.55rem;border-radius:8px;border:1.5px solid var(--t-border);font-size:0.77rem;font-weight:600;cursor:pointer;text-align:center;background:var(--t-bg);color:var(--t-muted);transition:all .18s}
.prio-btn.on-low{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.prio-btn.on-med{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.prio-btn.on-high{border-color:var(--red);background:var(--red-bg);color:var(--red)}

.ticket-item{display:flex;gap:0.8rem;align-items:flex-start;padding:0.9rem 1rem;background:var(--t-surface);border:1px solid var(--t-border);border-radius:12px;margin-bottom:0.7rem;transition:all .18s}
.ticket-item:hover{border-color:rgba(17,17,16,0.15);box-shadow:0 2px 10px rgba(17,17,16,0.05)}
.tk-icon-box{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.tk-name{font-weight:700;font-size:0.84rem;margin-bottom:0.15rem}
.tk-desc{font-size:0.74rem;color:var(--t-muted)}
.tk-row{display:flex;gap:0.5rem;margin-top:0.4rem;align-items:center}
.tks{font-size:0.69rem;font-weight:700;padding:0.18rem 0.5rem;border-radius:100px}
.tks-open{background:var(--blue-bg);color:var(--blue)}
.tks-prog{background:var(--amber-bg);color:var(--amber)}
.tks-done{background:var(--green-bg);color:var(--green)}
.tks-date{font-size:0.69rem;color:#c0bdb6}

/* ════════════════════════════════
   AGENT SCREENS
════════════════════════════════ */
.a-hero{
  background:linear-gradient(135deg,var(--a-surface2),#243860);
  border:1px solid rgba(201,149,42,0.2);border-radius:18px;padding:1.8rem;
  margin-bottom:1.3rem;position:relative;overflow:hidden;
}
.a-hero-pattern{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(201,149,42,0.05) 1px,transparent 1px);background-size:24px 24px}
.a-hero-eyebrow{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--a-accent);opacity:0.8;margin-bottom:0.35rem;position:relative;z-index:1}
.a-hero-amount{font-family:'DM Serif Display',serif;font-size:2.8rem;line-height:1;position:relative;z-index:1}
.a-hero-sub{font-size:0.79rem;color:var(--a-muted);margin-top:0.3rem;position:relative;z-index:1}
.a-hero-bottom{display:flex;gap:2rem;margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid rgba(201,149,42,0.15);position:relative;z-index:1}
.ah-stat .ahsv{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--a-accent)}
.ah-stat .ahsl{font-size:0.7rem;color:var(--a-muted);margin-top:1px}
.a-rank{background:linear-gradient(135deg,var(--a-accent),var(--a-accent2));color:#0d1b2e;border-radius:11px;padding:0.7rem 1rem;text-align:center;flex-shrink:0;position:relative;z-index:1}
.ar-lbl{font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;opacity:0.7}
.ar-val{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-top:0.15rem}
.ar-sub{font-size:0.66rem;opacity:0.7;margin-top:0.1rem}

.deal-row-item{
  display:flex;align-items:center;gap:0.85rem;
  padding:0.75rem 0;border-bottom:1px solid var(--a-border);
  cursor:pointer;transition:all .18s;border-radius:8px;
}
.deal-row-item:last-child{border-bottom:none}
.deal-row-item:hover{background:var(--a-surface2);padding-left:8px}
.deal-info{flex:1}
.deal-title{font-weight:600;font-size:0.84rem}
.deal-parties{font-size:0.72rem;color:var(--a-muted);margin-top:1px}
.deal-tags{display:flex;gap:0.3rem;margin-top:0.25rem}
.deal-comm{text-align:right;flex-shrink:0}
.dc-val{font-family:'DM Serif Display',serif;font-size:0.95rem;color:var(--a-accent)}
.dc-lbl{font-size:0.67rem;color:var(--a-muted)}

/* Pipeline kanban */
.pipeline-board{display:flex;gap:0.8rem;overflow-x:auto;padding-bottom:0.5rem;height:calc(100vh - 230px)}
.pipe-col{flex:0 0 190px;background:var(--a-surface);border:1px solid var(--a-border);border-radius:12px;padding:0.85rem;display:flex;flex-direction:column}
.pipe-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-shrink:0}
.pch-title{font-size:0.77rem;font-weight:700}
.pch-count{width:20px;height:20px;border-radius:50%;background:var(--a-surface2);display:flex;align-items:center;justify-content:center;font-size:0.64rem;font-weight:800;color:var(--a-muted)}
.pipe-cards{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem}
.pipe-card{background:var(--a-bg);border:1px solid var(--a-border);border-radius:9px;padding:0.75rem;cursor:pointer;transition:all .18s}
.pipe-card:hover{border-color:rgba(201,149,42,0.3);transform:translateX(2px)}
.pp-title{font-size:0.78rem;font-weight:700;margin-bottom:0.2rem}
.pp-addr{font-size:0.68rem;color:var(--a-muted);margin-bottom:0.4rem}
.pp-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:0.4rem}
.pp-comm{font-size:0.76rem;font-weight:700;color:var(--a-accent)}
.pp-days{font-size:0.66rem;color:var(--a-muted)}

/* Inspection cards */
.insp-card{background:var(--a-surface);border:1px solid var(--a-border);border-radius:14px;padding:1.2rem;transition:all .2s}
.insp-card:hover{border-color:var(--a-border);transform:translateY(-2px)}
.ic-head{display:flex;gap:0.8rem;align-items:flex-start;margin-bottom:0.9rem;padding-bottom:0.9rem;border-bottom:1px solid var(--a-border)}
.ic-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ic-title{font-weight:700;font-size:0.87rem;margin-bottom:0.15rem}
.ic-addr{font-size:0.73rem;color:var(--a-muted)}
.ic-deets{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:0.8rem}
.icd-lbl{font-size:0.66rem;color:var(--a-muted);text-transform:uppercase;letter-spacing:0.07em;font-weight:700;margin-bottom:0.15rem}
.icd-val{font-size:0.82rem;font-weight:600}
.ic-actions{display:flex;gap:0.5rem}
.icb{flex:1;padding:0.5rem;border-radius:8px;font-size:0.78rem;font-weight:700;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all .18s;text-align:center}
.icb-gold{background:var(--a-accent);color:#0d1b2e}
.icb-gold:hover{background:var(--a-accent2)}
.icb-ghost{background:var(--a-surface2);color:var(--a-muted)}
.icb-ghost:hover{color:var(--a-text)}
.icb-green{background:var(--green-bg);color:var(--green)}

/* Commission table */
.comm-tbl{background:var(--a-surface);border:1px solid var(--a-border);border-radius:13px;overflow:hidden}
.ct-head{display:grid;grid-template-columns:2fr 1.2fr 0.8fr 0.8fr 1fr 0.8fr;background:var(--a-surface2);padding:0.75rem 1.2rem;font-size:0.69rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--a-muted)}
.ct-row{display:grid;grid-template-columns:2fr 1.2fr 0.8fr 0.8fr 1fr 0.8fr;padding:0.8rem 1.2rem;border-top:1px solid var(--a-border);align-items:center;font-size:0.82rem;transition:background .15s;cursor:pointer}
.ct-row:hover{background:var(--a-surface2)}
.ct-deal-name{font-weight:600;font-size:0.82rem}
.ct-deal-date{font-size:0.69rem;color:var(--a-muted)}
.ct-amount{font-family:'DM Serif Display',serif;font-size:0.95rem;color:var(--a-accent)}

/* Reviews */
.review-card{background:var(--a-surface);border:1px solid var(--a-border);border-radius:13px;padding:1.1rem;margin-bottom:0.8rem;transition:border-color .18s}
.review-card:hover{border-color:var(--a-border2,rgba(248,246,240,0.13))}
.rv-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.6rem}
.rv-user{display:flex;gap:0.65rem;align-items:center}
.rv-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0}
.rv-name{font-weight:700;font-size:0.84rem}
.rv-role{font-size:0.7rem;color:var(--a-muted)}
.stars{color:var(--a-accent);font-size:0.82rem;letter-spacing:1px}
.rv-text{font-size:0.81rem;color:var(--a-muted);line-height:1.65;font-style:italic}
.rv-date{font-size:0.69rem;color:var(--a-muted);margin-top:0.5rem;opacity:0.6}

/* Clients */
.client-card{background:var(--a-surface);border:1px solid var(--a-border);border-radius:13px;padding:1.1rem;transition:all .2s;cursor:pointer}
.client-card:hover{border-color:var(--a-border);transform:translateY(-2px)}
.cc-head{display:flex;gap:0.75rem;align-items:center;margin-bottom:0.9rem;padding-bottom:0.9rem;border-bottom:1px solid var(--a-border)}
.cc-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.84rem;font-weight:700;flex-shrink:0}
.cc-name{font-weight:700;font-size:0.87rem}
.cc-type{font-size:0.72rem;color:var(--a-muted);margin-top:1px}
.cc-stats{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.ccs-val{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--a-accent)}
.ccs-lbl{font-size:0.68rem;color:var(--a-muted)}
.cc-actions{display:flex;gap:0.5rem;margin-top:0.9rem;padding-top:0.9rem;border-top:1px solid var(--a-border)}

/* Rep score */
.rep-hero{background:linear-gradient(135deg,var(--a-surface2),#243860);border:1px solid rgba(201,149,42,0.2);border-radius:18px;padding:1.8rem;margin-bottom:1.3rem;display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;position:relative;overflow:hidden}
.rep-hero::before{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,149,42,0.07),transparent 70%)}
.rep-score-ring{width:110px;height:110px;border-radius:50%;border:4px solid var(--a-accent);display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0;background:var(--a-surface);box-shadow:0 0 30px rgba(201,149,42,0.15);position:relative;z-index:1}
.rsr-val{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--a-accent);line-height:1}
.rsr-lbl{font-size:0.66rem;color:var(--a-muted);margin-top:2px}
.rep-details{position:relative;z-index:1}
.rep-details h3{font-family:'DM Serif Display',serif;font-size:1.25rem;margin-bottom:0.3rem}
.rep-badges{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.8rem}
.rep-badge{display:flex;align-items:center;gap:0.35rem;background:rgba(255,255,255,0.04);border:1px solid var(--a-border);border-radius:100px;padding:0.35rem 0.8rem;font-size:0.74rem;font-weight:600}

/* ════════════════════════════════
   SCREENS
════════════════════════════════ */
.screen{display:none}
.screen.active{display:block}

/* Shared table */
.data-tbl{background:var(--a-surface);border:1px solid var(--a-border);border-radius:13px;overflow:hidden}

/* ════════════════════════════════
   MOBILE RESPONSIVE — 768px and below
   Nigerian users: 90%+ on mobile
════════════════════════════════ */

/* ── Hamburger button (hidden on desktop) ─────────────── */
.mob-menu-btn {

// Token management
const Auth = {
  getAccess:    () => localStorage.getItem('propati_access'),
  getRefresh:   () => localStorage.getItem('propati_refresh'),
  getUser:      () => { try { return JSON.parse(localStorage.getItem('propati_user')); } catch { return null; } },
  getSavedRole: () => localStorage.getItem('propati_role'),
  save: (access, refresh, user) => {
    localStorage.setItem('propati_access',  access);
    localStorage.setItem('propati_refresh', refresh);
    localStorage.setItem('propati_user',    JSON.stringify(user));
    if (user?.role) localStorage.setItem('propati_role', user.role);
  },
  clear: () => {
    ['propati_access','propati_refresh','propati_user','propati_role','propati_purpose'].forEach(k => localStorage.removeItem(k));
  },
  isLoggedIn: () => !!localStorage.getItem('propati_access'),
};

// API helper — attaches token, handles 401 refresh automatically
async function apiCall(method, path, body = null, retry = true) {
  const headers = { 'Content-Type': 'application/json' };
  const token = Auth.getAccess();
  if (token) headers['Authorization'] = 'Bearer ' + token;

  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);

  let res = await fetch(API + path, opts);

  // Token expired — try refresh
  if (res.status === 401 && retry) {
    const refreshed = await tryRefresh();
    if (refreshed) return apiCall(method, path, body, false);
    Auth.clear();
    setState({ view: 'login', signupStep: 1, purpose: null, authError: 'Session expired. Please sign in again.' });
    return null;
  }

  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

async function tryRefresh() {
  const refresh = Auth.getRefresh();
  if (!refresh) return false;
  try {
    const res = await fetch(API + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    localStorage.setItem('propati_access',  data.access_token);
    localStorage.setItem('propati_refresh', data.refresh_token);
    return true;
  } catch { return false; }
}

function fmtNaira(n) {
  if (!n) return '₦0';
  const num = parseFloat(n);
  if (num >= 1000000) return '₦' + (num/1000000).toFixed(1) + 'M';
  if (num >= 1000) return '₦' + Math.round(num/1000) + 'k';
  return '₦' + Math.round(num).toLocaleString();
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = (Date.now() - new Date(dateStr)) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

async function doLogin() {
  const { email, password, role } = STATE.loginForm;
  if (!email || !password) { setState({ authError: 'Please enter your email and password' }); return; }

  setState({ authLoading: true, authError: '' });
  const res = await apiCall('POST', '/auth/login', { email, password });
  setState({ authLoading: false });

  if (!res || !res.ok) {
    setState({ authError: res?.data?.error || 'Invalid email or password. Try again.' });
    return;
  }

  const { user, access_token, refresh_token } = res.data;
  Auth.save(access_token, refresh_token, user);

  // Tenant goes to purpose picker if no purpose set
  if (user.role === 'tenant' && !STATE.purpose) {
    setState({ authStep: 2, loginForm: { ...STATE.loginForm, role: 'tenant' } });
    return;
  }

  enterDashboard(user);
}

async function doSignup() {

  if (!f.full_name || !f.email || !f.password) { setState({ authError: 'Please fill in all required fields' }); return; }
  if (f.password.length < 8) { setState({ authError: 'Password must be at least 8 characters' }); return; }
  if (!/[A-Z]/.test(f.password) || !/[0-9]/.test(f.password)) { setState({ authError: 'Password needs at least one uppercase letter and one number' }); return; }
  if (f.password !== f.confirmPassword) { setState({ authError: 'Passwords do not match' }); return; }

  setState({ authLoading: true, authError: '' });
  const res = await apiCall('POST', '/auth/signup', {
    full_name: f.full_name,
    email:     f.email,
    phone:     f.phone || undefined,
    password:  f.password,
    role:      f.role,
  });
  setState({ authLoading: false });

  if (!res || !res.ok) {
    setState({ authError: res?.data?.error || 'Signup failed. Please try again.' });
    return;
  }

  const { user, access_token, refresh_token } = res.data;
  Auth.save(access_token, refresh_token, user);
  showToast('🎉 Account created! Welcome to PROPATI');

  if (user.role === 'tenant' && !STATE.purpose) {
    setState({ authStep: 2, loginForm: { ...STATE.loginForm, role: 'tenant' } });
    return;
  }

  enterDashboard(user);
}

function enterDashboard(user) {
  const savedPurpose = localStorage.getItem('propati_purpose') || 'rent';
  const purpose = user.role === 'tenant' ? (STATE.purpose || savedPurpose) : null;
  if (purpose) localStorage.setItem('propati_purpose', purpose);
  // For estate manager, reset EM data so it reloads fresh
  if (user.role === 'estate_manager') {
    DATA.emOrg = null; DATA.emPortfolio = null; DATA.emTickets = null;
    DATA.emTeam = null; DATA.emLedger = null; DATA.emSubscription = null;
    STATE.emPage = 'home'; STATE.emOrgSetupStep = 1;
  }
  setState({ view: 'dashboard', role: user.role, page: 'home', showModal: false, adminPage: 'overview', purpose, authStep: 1, authError: '', authLoading: false });
  if (user.role === 'landlord') loadMyListings();
  if (user.role === 'tenant')   loadListings();
  if (user.role === 'agent')    loadListings();
}

function loginWithPurpose(purpose) {
  const user = Auth.getUser();
  setState({ purpose });
  enterDashboard(user || { role: 'tenant' });
  showToast('✅ Welcome! Set up as ' + PURPOSE_CONFIG[purpose].label);
}

// Check on load if user already has a valid session
async function checkSession() {
  if (!Auth.isLoggedIn()) return;
  // Show the last-used role immediately while we verify (no blank flash)
  const savedRole = Auth.getSavedRole();
  if (savedRole && Auth.getUser()) {
    const savedUser = Auth.getUser();
    const savedPurpose = localStorage.getItem('propati_purpose') || 'rent';
    STATE.role = savedRole;
    STATE.view = 'dashboard';
    STATE.purpose = savedUser.role === 'tenant' ? savedPurpose : null;
  }
  const res = await apiCall('GET', '/auth/me');
  if (res && res.ok) {
    const user = res.data.user;
    Auth.save(Auth.getAccess(), Auth.getRefresh(), user);
    enterDashboard(user);
  } else {
    Auth.clear();
    setState({ view: 'landing' });
  }
}

function navigate(page) {
  if (page !== 'messages') stopMsgPolling();
  if (page !== 'profile') { DATA.tenantProfile = null; }
  if (page !== 'receipts') { DATA.receipts = null; }
  setState({ page, showModal: false });
  if (page === 'properties' || page === 'listing')  { DATA.myListings = null; }
  if (page === 'search')     { DATA.listings = null; }
  if (page === 'payments')   loadTransactions();
  if (page === 'agreements') { DATA.agreements = null; }
  if (page === 'profile')    { DATA.tenantProfile = null; }
  if (page === 'receipts')   { DATA.receipts = null; }
  if (page === 'messages') {
    if (DATA.conversations === null) loadConversations();
    if (DATA.activeConv) startMsgPolling(DATA.activeConv.id);
  }
}

function switchRole(role) {
  setState({ role, page: 'home', showModal: false, adminPage: 'overview' });
  showToast('✅ Switched to ' + role + ' account');
}

function render() {
  const app = document.getElementById('app');
  if (STATE.view === 'landing') {

    if (DATA.listings === null && !DATA.loading.listings) loadListings();
    app.innerHTML = renderLanding();

  } else {

  bindAdminEvents();
}

          <div style="font-size:0.72rem;color:var(--t-muted);margin-bottom:0.6rem">📍 ${l.area} · ${l.beds} bed · Min. ${l.min} nights · ⭐ ${l.rating} (${l.reviews})</div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div><span style="font-weight:800;font-size:1.1rem;color:#c9952a">₦${l.price.toLocaleString()}</span><span style="font-size:0.72rem;color:var(--t-muted)">/night</span></div>
            <button style="padding:0.45rem 1rem;border-radius:8px;background:#c9952a;color:white;border:none;font-weight:700;font-size:0.78rem;cursor:pointer;font-family:Outfit,sans-serif" data-action="toast" data-msg="🌴 Booking ${l.title}... Redirecting to payment.">Book Now</button>
          </div>
        </div>
      </div>`).join('')}
    </div>
  </div>
</div>`;
}

// SHARED MESSAGES SCREEN
// ════════════════════════════════
function renderMessagesScreen(role) {
  const conversations = DATA.conversations || [];
  const activeConv    = DATA.activeConv || null;
  const messages      = DATA.convMessages || [];
  const myId          = Auth.getUser()?.id;
  const isLoading     = DATA.loading.conversations;
  const isLoadingMsgs = DATA.loading.messages;
  const accent        = role === 'landlord' ? '#d4622a' : '#0e7c6a';

  function convItem(c) {
    const isActive  = activeConv && activeConv.id === c.id;
    const other     = role === 'landlord' ? c.tenant_name : c.landlord_name;
    const otherInit = (other||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const lastMsg   = c.last_message || 'No messages yet';
    const unread    = c.unread_count > 0;
    return `
    <div style="display:flex;align-items:center;gap:0.7rem;padding:0.75rem;border-radius:10px;
      background:${isActive?`rgba(${role==='landlord'?'212,98,42':'14,124,106'},0.1)`:'transparent'};
      border:1.5px solid ${isActive?`rgba(${role==='landlord'?'212,98,42':'14,124,106'},0.3)`:'transparent'};
      cursor:pointer;transition:all .15s;margin-bottom:0.2rem"
      data-action="open-conversation" data-conv-id="${c.id}">
      <div style="width:38px;height:38px;border-radius:50%;background:${accent}22;
        display:flex;align-items:center;justify-content:center;font-weight:800;
        font-size:0.78rem;color:${accent};flex-shrink:0;position:relative">
        ${otherInit}
        ${unread?`<div style="position:absolute;top:-2px;right:-2px;width:10px;height:10px;
          border-radius:50%;background:#ef4444;border:2px solid var(--c-bg)"></div>`:''}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:${unread?800:600};font-size:0.83rem;
          color:${isActive?accent:'var(--c-text)'}">
          ${other || 'Unknown'}
        </div>
        <div style="font-size:0.72rem;color:var(--c-muted);white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis;margin-top:0.1rem;font-weight:${unread?600:400}">
          ${lastMsg.length>40?lastMsg.slice(0,40)+'…':lastMsg}
        </div>
      </div>
      <div style="font-size:0.65rem;color:var(--c-muted);flex-shrink:0">${timeAgo(c.last_message_at)||''}</div>
    </div>`;
  }

  function msgBubble(m) {
    const isMe = m.sender_id === myId;
    return `
    <div style="display:flex;justify-content:${isMe?'flex-end':'flex-start'};margin-bottom:0.6rem">
      <div style="max-width:68%;background:${isMe?accent:'var(--c-card)'};
        color:${isMe?'white':'var(--c-text)'};
        border-radius:${isMe?'14px 14px 4px 14px':'14px 14px 14px 4px'};
        padding:0.65rem 0.9rem;font-size:0.83rem;line-height:1.55;
        border:${isMe?'none':'1px solid var(--c-border)'}">
        <div>${m.content}</div>
        <div style="font-size:0.63rem;opacity:0.55;margin-top:0.3rem;text-align:${isMe?'right':'left'}">
          ${timeAgo(m.created_at)||'just now'} ${isMe&&m.is_read?'· ✓✓':''}
        </div>
      </div>
    </div>`;
  }

  const noConvs = `
  <div style="text-align:center;padding:2rem 1rem;color:var(--c-muted)">
    <div style="font-size:2rem;margin-bottom:0.6rem">💬</div>
    <div style="font-weight:700;font-size:0.88rem;color:var(--c-text);margin-bottom:0.4rem">No conversations yet</div>
    <div style="font-size:0.78rem;line-height:1.5">
      ${role==='landlord'
        ? 'When tenants apply for your properties, their messages appear here.'
        : 'Apply for a property to start a conversation with the landlord.'}
    </div>
    ${role==='tenant'?`
    <button style="margin-top:1rem;padding:0.55rem 1.2rem;border-radius:9px;border:none;
      background:${accent};color:white;font-family:Outfit,sans-serif;font-size:0.82rem;
      font-weight:700;cursor:pointer" data-action="nav" data-page="search">Browse Properties →</button>`:''}
  </div>`;

  const chatPanel = activeConv ? `
  <div style="display:flex;flex-direction:column;height:100%">
    <!-- Chat header -->
    <div style="padding:0.9rem 1.2rem;border-bottom:1px solid var(--c-border);
      display:flex;align-items:center;gap:0.8rem;flex-shrink:0">
      <div style="width:36px;height:36px;border-radius:50%;background:${accent}22;
        display:flex;align-items:center;justify-content:center;font-weight:800;
        font-size:0.78rem;color:${accent}">
        ${((role==='landlord'?activeConv.tenant_name:activeConv.landlord_name)||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
      </div>
      <div>
        <div style="font-weight:700;font-size:0.9rem">
          ${role==='landlord'?activeConv.tenant_name:activeConv.landlord_name}
        </div>
        <div style="font-size:0.72rem;color:var(--c-muted)">
          Re: ${activeConv.property_title||'Property enquiry'}
        </div>
      </div>
      <div style="margin-left:auto;font-size:0.72rem;color:${accent};font-weight:600">● Active</div>
    </div>

    <!-- Messages list -->
    <div id="msg-list" style="flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column">
      ${isLoadingMsgs
        ? '<div style="text-align:center;padding:2rem;color:var(--c-muted)">⏳ Loading messages…</div>'
        : messages.length === 0
          ? '<div style="text-align:center;padding:2rem;color:var(--c-muted)">No messages yet — send the first one!</div>'
          : messages.map(msgBubble).join('')}
    </div>

    <!-- Message input -->
    <div style="padding:0.85rem;border-top:1px solid var(--c-border);display:flex;gap:0.6rem;flex-shrink:0">
      <input id="msg-input" style="flex:1;padding:0.65rem 1rem;border-radius:10px;
        border:1.5px solid var(--c-border);background:var(--c-bg);color:var(--c-text);
        font-family:Outfit,sans-serif;font-size:0.85rem;outline:none;transition:border-color .15s"
        placeholder="Type a message…"
        onfocus="this.style.borderColor='${accent}'"
        onblur="this.style.borderColor='var(--c-border)'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"/>
      <button style="padding:0.65rem 1.2rem;border-radius:10px;border:none;background:${accent};
        color:white;font-family:Outfit,sans-serif;font-weight:700;cursor:pointer;
        font-size:0.85rem;transition:opacity .15s;white-space:nowrap"
        onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'"
        onclick="sendMessage()">Send ↑</button>
    </div>
  </div>` : `
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;color:var(--c-muted)">
    <div style="font-size:2.5rem;margin-bottom:0.8rem">💬</div>
    <div style="font-weight:700;color:var(--c-text);margin-bottom:0.3rem">Select a conversation</div>
    <div style="font-size:0.82rem">Choose from the list on the left</div>
  </div>`;

  return `
<div style="display:grid;grid-template-columns:280px 1fr;gap:0;height:calc(100vh - 140px);
  background:var(--c-card);border-radius:14px;overflow:hidden;
  border:1px solid var(--c-border)">

  <!-- Conversations sidebar -->
  <div style="border-right:1px solid var(--c-border);display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:1rem;border-bottom:1px solid var(--c-border);flex-shrink:0">
      <div style="font-weight:800;font-size:0.95rem;margin-bottom:0.6rem">Messages</div>
      <div style="position:relative">
        <input style="width:100%;padding:0.5rem 0.8rem 0.5rem 2rem;border-radius:9px;
          border:1.5px solid var(--c-border);background:var(--c-bg);color:var(--c-text);
          font-family:Outfit,sans-serif;font-size:0.8rem;outline:none;box-sizing:border-box"
          placeholder="Search conversations…" oninput="filterConversations(this.value)"/>
        <span style="position:absolute;left:0.6rem;top:50%;transform:translateY(-50%);
          font-size:0.8rem;opacity:0.5">🔍</span>
      </div>
    </div>
    <div id="conv-list" style="flex:1;overflow-y:auto;padding:0.6rem">
      ${isLoading
        ? '<div style="text-align:center;padding:2rem;color:var(--c-muted)">⏳ Loading…</div>'
        : conversations.length === 0
          ? noConvs
          : conversations.map(convItem).join('')}
    </div>
  </div>

  <!-- Chat panel -->
  <div id="chat-panel" style="overflow:hidden;display:flex;flex-direction:column">
    ${chatPanel}
  </div>
</div>`;
}

// SHARED TENANT SCREEN RENDERER
// (all non-messages tenant pages — they already live in renderLandlordScreen
//  with role-appropriate content filled by STATE.role checks)

function renderSharedTenantScreen(page) {
  switch(page) {
    case 'home': {
      const u = Auth.getUser() || {};
      const purpose = STATE.purpose || 'rent';

      const unverified = !u.nin_verified && !u.id_verified;
      return `
<div class="main-content">
  <!-- Purpose switcher -->
  <div style="display:flex;gap:0.35rem;margin-bottom:1rem;background:rgba(0,0,0,0.04);border-radius:12px;padding:0.3rem">
    ${Object.entries(PURPOSE_CONFIG).map(([key,p])=>`
    <button onclick="STATE.purpose='${key}';localStorage.setItem('propati_purpose','${key}');render()" style="flex:1;padding:0.5rem 0.4rem;border-radius:9px;border:none;cursor:pointer;font-family:Outfit,sans-serif;font-weight:700;font-size:0.75rem;transition:all .18s;background:${purpose===key?'white':'transparent'};color:${purpose===key?p.color:'var(--t-muted)'};box-shadow:${purpose===key?'0 1px 4px rgba(0,0,0,0.1)':'none'}">${p.icon} ${p.label}</button>`).join('')}
  </div>
  <!-- Profile completion banner -->
  ${(incomplete || unverified) ? `
  <div style="background:rgba(201,149,42,0.08);border:1px solid rgba(201,149,42,0.22);border-radius:12px;padding:0.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap">
    <span style="font-size:1rem">⚠️</span>
    <div style="flex:1;min-width:180px">
      <div style="font-weight:700;font-size:0.83rem;color:#92400e">Complete your profile to get approved faster</div>
      <div style="font-size:0.73rem;color:#78350f;margin-top:0.1rem">${incomplete?'Add employment details · ':''}${unverified?'Verify your identity':''}</div>
    </div>
    <button onclick="navigate('profile')" style="padding:0.42rem 0.9rem;border-radius:8px;border:none;background:#c9952a;color:white;font-weight:700;font-size:0.76rem;cursor:pointer;font-family:Outfit,sans-serif;white-space:nowrap">Complete →</button>
  </div>` : ''}
  <!-- Welcome card -->
  <div style="background:linear-gradient(135deg,var(--t-accent),var(--t-accent2));border-radius:14px;padding:1.2rem 1.4rem;margin-bottom:1.2rem;color:white">
    <div style="font-weight:800;font-size:1rem;margin-bottom:0.2rem">Welcome back, ${u.full_name?.split(' ')[0] || 'there'}! ${pc.icon}</div>
    <div style="font-size:0.78rem;opacity:0.85">You're set up to ${pc.label.toLowerCase()} · ${new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long'})}</div>
  </div>
  <!-- Stats -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;margin-bottom:1.2rem">
    ${[['🏠','Current Home','—'],['💳','Next Payment','—'],['✅','Profile', (!u.employment_status||!u.yearly_income)?'Incomplete':'Complete']].map(s=>`
    <div class="card"><div class="card-body" style="text-align:center;padding:1rem 0.6rem">
      <div style="font-size:1.5rem;margin-bottom:0.3rem">${s[0]}</div>
      <div style="font-size:0.85rem;font-weight:800">${s[2]}</div>
      <div style="font-size:0.68rem;color:var(--t-muted);margin-top:0.1rem">${s[1]}</div>
    </div></div>`).join('')}
  </div>
  <!-- Quick actions -->
  <div class="card">
    <div class="card-head"><span class="card-title">Quick Actions</span></div>
    <div class="card-body" style="display:flex;flex-wrap:wrap;gap:0.6rem">
      ${[['🔍 Browse','search'],['💬 Messages','messages'],['📄 Agreements','agreements'],['💳 Payments','payments'],['👤 My Profile','profile'],['🧾 Receipts','receipts']].map(([l,p])=>`
      <button style="padding:0.5rem 0.9rem;border-radius:9px;border:1.5px solid var(--t-border);background:transparent;color:var(--t-text);font-family:Outfit,sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer" data-action="nav" data-page="${p}">${l}</button>`).join('')}
    </div>
  </div>
</div>`;
    }
    case 'search': {
      if (DATA.listings === null) { loadListings(); return `<div style="padding:2rem;text-align:center;color:var(--t-muted)">⏳ Loading listings…</div>`; }
      const listings = DATA.listings;
      const cat = STATE.tenantCat || 'all';
      const filtered = listings.filter(l => cat === 'all' || l.listing_type === cat);
      return `
<div class="main-content">
  <div class="page-header">
    <div class="page-title">Find Property</div>
    <div class="page-sub">${listings.length} live listing${listings.length!==1?'s':''}</div>
  </div>
  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap">

    <button style="padding:0.4rem 0.9rem;border-radius:100px;border:1.5px solid ${cat===v?'#0e7c6a':'var(--t-border)'};background:${cat===v?'rgba(14,124,106,0.1)':'transparent'};color:${cat===v?'#0e7c6a':'var(--t-text)'};font-family:Outfit,sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer" data-action="setcat" data-cat="${v}">${l}</button>`).join('')}
  </div>
  ${filtered.length === 0
    ? `<div class="card"><div class="card-body" style="text-align:center;padding:2rem;color:var(--t-muted)"><div style="font-size:2rem;margin-bottom:0.5rem">🏚️</div><div style="font-weight:700;color:var(--t-text)">No listings yet</div><div style="font-size:0.82rem;margin-top:0.3rem">Landlords haven't listed properties in this category yet.</div></div></div>`
    : `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:1rem">${filtered.map(l=>listingCard(l,{onApply:`openConversation('${l.landlord_id||''}','${l.id||''}','${(l.title||'').replace(/'/g,"\\'")}')`,applyLabel:'Apply & Message'})).join('')}</div>`}
</div>`;
    }
    case 'payments': {
      if (DATA.transactions === null) { loadTransactions(); return `<div style="padding:2rem;text-align:center;color:var(--t-muted)">⏳ Loading…</div>`; }
      const txs = DATA.transactions;
      return `
<div class="main-content">

// ════════════════════════════════
// EVENT BINDING
// ════════════════════════════════
function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const action = el.dataset.action;
      switch(action) {
        case 'setrole':
          Object.assign(STATE.loginForm, { role: el.dataset.role });
          if (el.dataset.role !== 'tenant') STATE.purpose = null;
          STATE.authStep = 1;
          render(); break;
        case 'set-signup-role':
          STATE.signupForm.role = el.dataset.role;
          if (el.dataset.role !== 'tenant') STATE.purpose = null;
          render(); break;
        case 'switch-to-signup':
          setState({ authMode: 'signup', authError: '', authStep: 1 }); break;
        case 'switch-to-login':
          setState({ authMode: 'login', authError: '', authStep: 1, forgotSuccess: '' }); break;
        case 'show-forgot-password':
          setState({ authMode: 'forgot', authError: '', forgotSuccess: '' }); break;
        case 'login':
          doLogin(); break;
        case 'logout': logout(); break;  // calls real API logout + clears tokens
        case 'goto-login':
          setState({ view: 'login', authStep: 1, authMode: 'login', authError: '', purpose: null, loginForm: { email: '', password: '', role: 'landlord' } }); break;
        case 'goto-landing':
          setState({ view: 'landing', signupStep: 1, purpose: null }); break;
        case 'goto-dashboard':
          if (Auth.isLoggedIn()) enterDashboard(Auth.getUser());
          else setState({ view: 'login' });
          break;
        case 'nav':
          navigate(el.dataset.page); break;
        case 'set-verify-step':
          STATE.verifyStep = parseInt(el.dataset.step);
          render(); break;
        case 'set-landing-type':
          STATE.landingType = el.dataset.type;
          if (DATA.listings === null) loadListings();
          else render();
          break;
        case 'do-landing-search': {
          const q = document.getElementById('hero-search')?.value || document.getElementById('nav-search')?.value || '';
          STATE.landingQuery = q;
          if (DATA.listings === null) loadListings();
          else render();
          break; }
        case 'quick-search':
          STATE.landingQuery = el.dataset.query || '';
          STATE.landingType  = 'all';
          if (DATA.listings === null) loadListings();
          else render();
          break;
        case 'load-more-listings':
          showToast('⏳ Loading more listings…');
          break;
        case 'open-listing':
          if (Auth.isLoggedIn()) { setState({ view:'dashboard', role: Auth.getUser()?.role||'tenant', page:'search', purpose: STATE.purpose||'rent' }); enterDashboard(Auth.getUser()||{role:'tenant'}); }
          else setState({ view:'login', authMode:'login', authError:'', authStep:1 });
          break;
        case 'open-conversation': {
          const convId = el.dataset.convId;
          const conv = (DATA.conversations||[]).find(c => String(c.id) === String(convId));
          if (conv) {
            DATA.activeConv = conv;
            DATA.convMessages = [];
            render();
            loadMessages(convId);
            startMsgPolling(convId);
          }
          break; }
        case 'filter-listings':
          STATE.listingFilter = el.dataset.filter;
          if (DATA.listings !== null) {
            loadListings(el.dataset.filter ? { listing_type: el.dataset.filter } : {});
          }
          render(); break;
        case 'modal':
          setState({ showModal: true }); break;
        case 'closemodal':
          setState({ showModal: false }); break;
        case 'switchrole':
          switchRole(el.dataset.role); break;
        case 'em-navigate':
          emNavigate(el.dataset.page); break;
        case 'em-ticket-filter':
          STATE.emTicketFilter = el.dataset.filter;
          loadEmTickets();
          break;
        case 'toast':
          showToast(el.dataset.msg); break;
        case 'primary-btn':
          if(STATE.role==='landlord') navigate('listing');
          else if(STATE.role==='tenant') {
            const p = STATE.purpose;
            if(p==='buy') navigate('offers');
            else if(p==='shortlet') navigate('bookings');
            else if(p==='share') navigate('matches');
            else navigate('payments');
          }
          else navigate('listings');
          break;
        case 'setcat':
          STATE.tenantCat = el.dataset.cat; render(); break;
        case 'setprio':
          STATE.tenantPrio = el.dataset.prio; render(); break;
        case 'demo-login':
          loginDemo(el.dataset.role); break;
        case 'set-purpose':
          STATE.purpose = el.dataset.purpose; render(); break;
        case 'confirm-purpose':
          if (STATE.purpose) loginWithPurpose(STATE.purpose);
          else showToast('👆 Pick one above to continue'); break;
        case 'back-to-step1':
          STATE.authStep = 1; render(); break;
        case 'change-purpose':
          STATE.signupStep = 2; setState({ view: 'login' }); break;
      }
    };
  });

  // Call timer
  const timerEl = document.getElementById('callTimer');
  if (timerEl && !window._timerStarted) {
    window._timerStarted = true;
    let sec = 272;
    setInterval(() => {
      const el = document.getElementById('callTimer');
      if (!el) return;
      sec++;
      const m = Math.floor(sec/60), s = sec%60;
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }, 1000);
  }
}

async function loadEmOrg() {
  if (DATA.loading.emOrg) return;
  DATA.loading.emOrg = true;
  const res = await apiCall('GET', '/orgs/mine');
  DATA.loading.emOrg = false;
  if (res && res.ok && res.data && res.data.id) {
    DATA.emOrg = res.data;
    loadEmPortfolio();
    loadEmTickets();
    loadEmTeam();
  } else {
    // Set to false (not null) to prevent re-fetching — null would trigger reload
    DATA.emOrg = false;
  }
  render();
}

async function loadEmPortfolio() {
  if (!DATA.emOrg) return;
  const res = await apiCall('GET', `/orgs/${DATA.emOrg.id}/portfolio`);
  if (res && res.ok) DATA.emPortfolio = res.data.properties || [];
  else DATA.emPortfolio = [];
  render();
}

async function loadEmTickets() {
  if (!DATA.emOrg) return;
  const filter = STATE.emTicketFilter !== 'all' ? `?status=${STATE.emTicketFilter}` : '';
  const res = await apiCall('GET', `/orgs/${DATA.emOrg.id}/tickets${filter}`);
  if (res && res.ok) DATA.emTickets = res.data.tickets || [];
  else DATA.emTickets = [];
  // Update badge in nav
  const openCount = (DATA.emTickets || []).filter(t => t.status === 'open').length;
  const badge = EM_NAV.flatMap(s=>s.items).find(i=>i.id==='maintenance');
  if (badge) badge.badge = openCount || null;
  render();
}

async function loadEmTeam() {
  if (!DATA.emOrg) return;
  const res = await apiCall('GET', `/orgs/${DATA.emOrg.id}/team`);
  if (res && res.ok) DATA.emTeam = res.data.members || [];
  else DATA.emTeam = [];
  render();
}

async function loadEmLedger() {
  if (!DATA.emOrg) return;
  const res = await apiCall('GET', `/orgs/${DATA.emOrg.id}/ledger`);
  if (res && res.ok) DATA.emLedger = res.data.entries || [];
  else DATA.emLedger = [];
  render();
}

async function loadEmSubscription() {
  if (!DATA.emOrg) return;
  const res = await apiCall('GET', `/orgs/${DATA.emOrg.id}/subscription`);
  if (res && res.ok) DATA.emSubscription = res.data;
  else DATA.emSubscription = null;
  render();
}

async function createEmOrg() {
  const f = STATE.emOrgForm;
  if (!f.name.trim()) { showToast('Organisation name is required'); return; }
  if (!f.billing_email.trim()) { showToast('Billing email is required'); return; }
  setState({ authLoading: true });
  const res = await apiCall('POST', '/orgs', { name: f.name.trim(), billing_email: f.billing_email.trim(), address: f.address.trim(), cac_number: f.cac_number.trim() });
  setState({ authLoading: false });
  if (res && res.ok) {
    DATA.emOrg = res.data.org;
    STATE.emOrgSetupStep = 2; // move to plan selection
    render();
  } else {
    showToast(res?.data?.error || 'Failed to create organisation');
  }
}

async function emSubscribePlan(plan) {
  if (!DATA.emOrg) return;
  setState({ authLoading: true });
  const res = await apiCall('POST', `/orgs/${DATA.emOrg.id}/subscribe`, { plan });
  setState({ authLoading: false });
  if (res && res.ok) {
    // Paystack hosted page — redirect
    if (res.data.authorization_url) {
      window.location.href = res.data.authorization_url;
    } else {
      DATA.emOrg.plan_tier = plan;
      STATE.emOrgSetupStep = 3;
      render();
    }
  } else {
    showToast(res?.data?.error || 'Payment initiation failed');
  }
}

async function emInviteMember() {
  if (!DATA.emOrg) return;
  const f = STATE.emInviteForm;
  if (!f.email.trim()) { showToast('Email is required'); return; }
  setState({ authLoading: true });
  const res = await apiCall('POST', `/orgs/${DATA.emOrg.id}/invite`, { email: f.email.trim(), role: f.role });
  setState({ authLoading: false });
  if (res && res.ok) {
    STATE.emInviteForm = { email: '', role: 'manager' };
    showToast('Invitation sent to ' + f.email);
    loadEmTeam();
  } else {
    showToast(res?.data?.error || 'Failed to send invitation');
  }
}

async function emRemoveMember(userId) {
  if (!DATA.emOrg) return;
  if (!confirm('Remove this team member?')) return;
  const res = await apiCall('DELETE', `/orgs/${DATA.emOrg.id}/members/${userId}`);
  if (res && res.ok) { showToast('Member removed'); loadEmTeam(); }
  else showToast('Failed to remove member');
}

async function emUpdateTicket(ticketId, updates) {
  if (!DATA.emOrg) return;
  const res = await apiCall('PATCH', `/orgs/${DATA.emOrg.id}/tickets/${ticketId}`, updates);
  if (res && res.ok) loadEmTickets();
  else showToast('Failed to update ticket');
}

async function emCreateTicket() {
  if (!DATA.emOrg) return;
  const title = document.getElementById('em-ticket-title')?.value?.trim();
  const desc = document.getElementById('em-ticket-desc')?.value?.trim();
  const cat = document.getElementById('em-ticket-cat')?.value;
  const prio = document.getElementById('em-ticket-prio')?.value;
  const propId = document.getElementById('em-ticket-prop')?.value;
  if (!title) { showToast('Ticket title is required'); return; }
  const res = await apiCall('POST', `/orgs/${DATA.emOrg.id}/tickets`, { title, description: desc, category: cat, priority: prio, property_id: propId || null });
  if (res && res.ok) { showToast('Ticket created'); loadEmTickets(); }
  else showToast(res?.data?.error || 'Failed to create ticket');
}

async function emBulkUpload() {
  if (!DATA.emOrg) return;
  const fileInput = document.getElementById('em-bulk-file');
  if (!fileInput || !fileInput.files[0]) { showToast('Please select a CSV file'); return; }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  setState({ authLoading: true });
  try {
    const res = await fetch(`${API}/orgs/${DATA.emOrg.id}/bulk-upload`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + Auth.getAccess() },
      body: formData,
    });
    const data = await res.json();
    setState({ authLoading: false });
    if (res.ok) {
      DATA.emBulkPreview = data.preview || [];
      STATE.emBulkFile = data;
      showToast(`${data.imported || 0} properties imported, ${data.errors || 0} errors`);
      loadEmPortfolio();
    } else {
      showToast(data.error || 'Bulk upload failed');
    }
  } catch(e) {
    setState({ authLoading: false });
    showToast('Upload failed — check connection');
  }
}

async function emDownloadReport() {
  if (!DATA.emOrg) return;
  const month = STATE.emReportMonth;
  setState({ authLoading: true });
  const res = await apiCall('GET', `/orgs/${DATA.emOrg.id}/reports/${month}`);
  setState({ authLoading: false });
  if (res && res.ok && res.data.url) {
    window.open(res.data.url, '_blank');
  } else {
    showToast('Report not available yet for ' + month);
  }
}

function emNavigate(page) {
  STATE.emPage = page;
  // Lazy-load data for each section
  if (page === 'rent' && !DATA.emLedger) loadEmLedger();
  if (page === 'maintenance') loadEmTickets();
  if (page === 'team') loadEmTeam();
  if (page === 'billing') loadEmSubscription();
  if (page === 'portfolio' && !DATA.emPortfolio) loadEmPortfolio();
  render();
}

function renderEstateManagerScreen(page) {
  const org = DATA.emOrg || {};
  switch(page) {

    // ─── HOME: PORTFOLIO OVERVIEW DASHBOARD ───────────────────

      const props = DATA.emPortfolio || [];
      const tickets = DATA.emTickets || [];
      const occupied = props.filter(p => p.tenant_id || p.is_occupied).length;
      const vacant = props.length - occupied;
      const arrears = props.filter(p => p.rent_status === 'overdue').length;
      const openT = tickets.filter(t => t.status === 'open').length;
      const totalMonthlyRent = props.reduce((s,p) => s + (parseFloat(p.price)||0)/12, 0);
      const loading = DATA.loading.emOrg || (!DATA.emPortfolio && DATA.loading.emPortfolio);
      if (loading) return `<div class="em-empty"><div class="em-empty-icon">⏳</div>Loading portfolio…</div>`;
      return `
        <div class="em-kpi-grid">
          <div class="em-kpi" style="border-top:3px solid #6EA8FE">
            <div class="em-kpi-val">${props.length}</div>
