<!-- Tab Switcher -->

                    Debit/Credit Card

<button class="flex-1 py-md font-label-md text-label-md border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-all" id="bankTabBtn" onclick="switchTab('bank')">
                    Bank Account
                </button>
</div>
<!-- Form Content -->
<div class="p-lg">
<!-- Card Form -->
<div class="space-y-md block" id="cardForm">
<div class="space-y-xs">

<script>
        function switchTab(tab) {
            const cardForm = document.getElementById('cardForm');
            const bankForm = document.getElementById('bankForm');
            const cardBtn = document.getElementById('cardTabBtn');
            const bankBtn = document.getElementById('bankTabBtn');

            if (tab === 'card') {
                cardForm.classList.remove('hidden');
                bankForm.classList.add('hidden');
                cardBtn.classList.add('border-primary', 'text-primary');
                cardBtn.classList.remove('border-transparent', 'text-on-surface-variant');
                bankBtn.classList.remove('border-primary', 'text-primary');
                bankBtn.classList.add('border-transparent', 'text-on-surface-variant');
            } else {
                cardForm.classList.add('hidden');
                bankForm.classList.remove('hidden');
                bankBtn.classList.add('border-primary', 'text-primary');
                bankBtn.classList.remove('border-transparent', 'text-on-surface-variant');
                cardBtn.classList.remove('border-primary', 'text-primary');
                cardBtn.classList.add('border-transparent', 'text-on-surface-variant');
            }
        }

        function closeModal() {
            const modal = document.getElementById('paymentModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                // In a real app we might remove it or hide it
                // modal.style.display = 'none';
            }, 300);
        }

        // Simple mock for "Auto-fetching" account name
        const accNumInput = document.getElementById('accountNumber');
        const loader = document.getElementById('loadingAccount');
        const accName = document.getElementById('accountNamePlaceholder');
        const verified = document.getElementById('verifiedIcon');

        accNumInput?.addEventListener('input', (e) => {
            if (e.target.value.length === 10) {
                loader.classList.remove('hidden');
                accName.textContent = "Fetching...";
                setTimeout(() => {
                    loader.classList.add('hidden');
                    accName.textContent = "ADEWALE SULEIMAN BOLAJI";
                    accName.classList.add('text-primary', 'font-semibold');
                    verified.classList.remove('hidden');
                }, 1200);
            } else {
                accName.textContent = "Enter account number to fetch name";
                accName.classList.remove('text-primary', 'font-semibold');
                verified.classList.add('hidden');
                loader.classList.add('hidden');
            }
        });
    </script>
